# Production stack. Driven by Woodpecker; secrets come from the runner env.
#
# Required env:
#   DATABASE_PASSWORD
#   DATABASE_URL
#   BETTER_AUTH_SECRET
#   LOGTO_ENDPOINT
#   LOGTO_APP_ID
#   LOGTO_APP_SECRET
#   LOGTO_REDIRECT_URI
#   LOGTO_POST_LOGOUT_REDIRECT_URI
#   CLIENT_ORIGIN
#   APP_BASE_URL
#   AUTH_BASE_URL
#   VITE_BACKEND_URL
#   VITE_LOGTO_ENDPOINT

x-db-env: &db-env
  DATABASE_USER: p1002_scmgrinder
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
  DATABASE_NAME: p1002_scmgrinder
  DATABASE_HOST: db
  DATABASE_PORT: 5432
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}

services:
  db:
    image: scvmrack-db:prod
    build:
      context: backend
      dockerfile: Dockerfile.prod-db
    deploy:
      restart_policy:
        condition: on-failure
    environment:
      POSTGRES_USER: p1002_scmgrinder
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      POSTGRES_DB: p1002_scmgrinder
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p1002_scmgrinder -d p1002_scmgrinder"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: scvmrack-backend:prod
    build:
      context: .
      dockerfile: backend/Dockerfile
    deploy:
      replicas: ${BACKEND_REPLICAS:-1}
      update_config:
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
    stop_grace_period: 30s
    environment:
      <<: *db-env
      PORT: 3000
      NODE_ENV: production
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?CLIENT_ORIGIN is required}
      CLIENT_GATEWAY: ${CLIENT_GATEWAY:-}
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL is required}
      AUTH_BASE_URL: ${AUTH_BASE_URL:?AUTH_BASE_URL is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      LOGTO_ENDPOINT: ${LOGTO_ENDPOINT:?LOGTO_ENDPOINT is required}
      LOGTO_APP_ID: ${LOGTO_APP_ID:?LOGTO_APP_ID is required}
      LOGTO_APP_SECRET: ${LOGTO_APP_SECRET:?LOGTO_APP_SECRET is required}
      LOGTO_REDIRECT_URI: ${LOGTO_REDIRECT_URI:?LOGTO_REDIRECT_URI is required}
      LOGTO_POST_LOGOUT_REDIRECT_URI: ${LOGTO_POST_LOGOUT_REDIRECT_URI:?LOGTO_POST_LOGOUT_REDIRECT_URI is required}
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      VITE_GLITCHTIP_DSN: ${VITE_GLITCHTIP_DSN:-}
      GLITCHTIP_UPSTREAM: ${GLITCHTIP_UPSTREAM:-}
      DEBUG_BOOM_TOKEN: ${DEBUG_BOOM_TOKEN:-}
    ports:
      - target: 3000
        published: 3041
        protocol: tcp
    networks:
      - db
      - rpg-network
    depends_on:
      - db
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  frontend:
    image: scvmrack-frontend:prod
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:?VITE_BACKEND_URL is required}
        VITE_LOGTO_ENDPOINT: ${VITE_LOGTO_ENDPOINT:?VITE_LOGTO_ENDPOINT is required}
        VITE_SITE_URL: ${VITE_SITE_URL:-}
        VITE_GLITCHTIP_DSN: ${VITE_GLITCHTIP_DSN:-}
    deploy:
      replicas: ${FRONTEND_REPLICAS:-1}
      update_config:
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 3040
        protocol: tcp
    networks:
      - rpg-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://127.0.0.1/"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  pgdata:
    name: scvmrack-prod_pgdata

networks:
  db:
    internal: true
    attachable: true
  rpg-network:
    external: true
