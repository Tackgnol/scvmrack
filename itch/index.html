<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SCVMRACK — MÖRK BORG Character Sheet</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      .fallback {
        position: absolute;
        inset: 0;
        z-index: -1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: monospace;
        color: #ffe600;
        background: #000;
        text-align: center;
        padding: 1rem;
      }
      .fallback a {
        color: #ffe600;
      }
    </style>
  </head>
  <body>
    <!-- Shown only if the iframe fails to load (e.g. browser blocks third-party frames). -->
    <div class="fallback">
      <p>
        If the app does not load here, open it directly:<br />
        <a href="https://scvmrack.rpgtools.co" target="_blank" rel="noopener"
          >scvmrack.rpgtools.co</a
        >
      </p>
    </div>
    <iframe
      src="https://scvmrack.rpgtools.co"
      allow="fullscreen; clipboard-write"
      title="SCVMRACK"
    ></iframe>
  </body>
</html>
