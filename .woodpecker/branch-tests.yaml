# Runs on pull requests. GitHub can use this workflow status as the merge gate.

when:
  - event: pull_request

steps:
  unit-test:
    image: mcr.microsoft.com/playwright:v1.58.2-jammy
    commands:
      - |
        set -e
        cleanup() {
          rm -rf node_modules client/node_modules client/public client/coverage client/coverage-unit client/coverage-browser reports
          npm cache clean --force || true
        }
        cleanup
        trap cleanup EXIT

        pwd
        ls -la package-lock.json client/package-lock.json || true

        if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
          npm ci --no-audit --no-fund
        else
          npm install --no-audit --no-fund
        fi
        npm --prefix tests/unit-be run test

        rm -rf node_modules
        npm cache clean --force || true

        npm --prefix client ci --no-audit --no-fund
        npm --prefix client run test:unit

  integration-test:
    image: docker:27-cli
    depends_on:
      - browser-test-webkit
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - |
        set -e
        docker builder prune -af || true
        docker image prune -f || true
        docker compose -f compose.integration-be.yaml down --volumes --remove-orphans || true
        trap 'docker compose -f compose.integration-be.yaml down --volumes --remove-orphans; docker builder prune -af || true; docker image prune -f || true' EXIT
        docker compose -f compose.integration-be.yaml up \
          --build --abort-on-container-exit --exit-code-from integration \
          db api integration

  browser-test-chromium:
    image: mcr.microsoft.com/playwright:v1.58.2-jammy
    depends_on:
      - unit-test
    environment:
      VITEST_BROWSER_INSTANCES: chromium
      CI: "true"
    commands:
      - |
        set -e
        cleanup() {
          rm -rf client/node_modules client/public client/coverage client/coverage-unit client/coverage-browser
          npm cache clean --force || true
        }
        cleanup
        trap cleanup EXIT

        npm --prefix client ci --no-audit --no-fund
        npm --prefix client run test:browser

  browser-test-firefox:
    image: mcr.microsoft.com/playwright:v1.58.2-jammy
    depends_on:
      - browser-test-chromium
    environment:
      VITEST_BROWSER_INSTANCES: firefox
    commands:
      - |
        set -e
        cleanup() {
          rm -rf client/node_modules client/public client/coverage client/coverage-unit client/coverage-browser
          npm cache clean --force || true
        }
        cleanup
        trap cleanup EXIT

        npm --prefix client ci --no-audit --no-fund
        npm --prefix client run test:browser

  browser-test-webkit:
    image: mcr.microsoft.com/playwright:v1.58.2-jammy
    depends_on:
      - browser-test-firefox
    environment:
      VITEST_BROWSER_INSTANCES: webkit
    commands:
      - |
        set -e
        cleanup() {
          rm -rf client/node_modules client/public client/coverage client/coverage-unit client/coverage-browser
          npm cache clean --force || true
        }
        cleanup
        trap cleanup EXIT

        npm --prefix client ci --no-audit --no-fund
        npm --prefix client run test:browser

  e2e-test:
    image: docker:27-cli
    depends_on:
      - integration-test
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      CI: "true"
      PLAYWRIGHT_INCLUDE_REGRESSION: "1"
    commands:
      - |
        set -e
        docker compose -f compose.e2e.yaml down --volumes --remove-orphans || true
        docker builder prune -af || true
        docker image prune -f || true
        trap 'docker compose -f compose.e2e.yaml down --volumes --remove-orphans' EXIT
        docker compose -f compose.e2e.yaml up \
          --build --abort-on-container-exit --exit-code-from e2e \
          db api web mailpit e2e
