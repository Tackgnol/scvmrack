# Runs on pull requests. GitHub can use this workflow status as the merge gate.

when:
  - event: pull_request

steps:
  secret-scan:
    image: trufflesecurity/trufflehog:latest
    commands:
      - trufflehog git file://. --only-verified --fail

  static-analysis:
    image: semgrep/semgrep
    depends_on:
      - secret-scan
    commands:
      - |
        set -e
        export SEMGREP_SRC_DIRECTORY="$CI_WORKSPACE"
        semgrep scan --config auto --error .

  iac-scan:
    image: aquasec/trivy:0.70.0
    depends_on:
      - secret-scan
    commands:
      - trivy fs --scanners misconfig --exit-code 1 --severity HIGH,CRITICAL --no-progress .

  unit-test:
    image: mcr.microsoft.com/playwright:v1.58.2-jammy
    depends_on:
      - static-analysis
      - iac-scan
    environment:
      NPMRC_CONTENT:
        from_secret: npmrc_content
    commands:
      - |
        set -e
        cleanup() {
          rm -f .npmrc backend/.npmrc
          rm -rf backend/node_modules frontend/node_modules frontend/dist frontend/coverage frontend/coverage-unit frontend/coverage-browser reports
          npm cache clean --force || true
        }
        cleanup
        trap cleanup EXIT

        printf '%s\n' "$NPMRC_CONTENT" > .npmrc
        cp .npmrc backend/.npmrc
        npm --prefix backend ci --no-audit --no-fund
        rm -f .npmrc backend/.npmrc
        npm --prefix backend/tests/unit-be run test

        npm --prefix frontend ci --no-audit --no-fund
        npm --prefix frontend run test:unit

  browser-test-chromium:
    image: mcr.microsoft.com/playwright:v1.58.2-jammy
    depends_on:
      - unit-test
    environment:
      VITEST_BROWSER_INSTANCES: chromium
      CI: "true"
    commands:
      - |
        set -e
        npm --prefix frontend ci --no-audit --no-fund
        npm --prefix frontend run test:browser

  browser-test-firefox:
    image: mcr.microsoft.com/playwright:v1.58.2-jammy
    depends_on:
      - browser-test-chromium
    environment:
      VITEST_BROWSER_INSTANCES: firefox
      CI: "true"
    commands:
      - |
        set -e
        npm --prefix frontend ci --no-audit --no-fund
        npm --prefix frontend run test:browser

  browser-test-webkit:
    image: mcr.microsoft.com/playwright:v1.58.2-jammy
    depends_on:
      - browser-test-firefox
    environment:
      VITEST_BROWSER_INSTANCES: webkit
      CI: "true"
    commands:
      - |
        set -e
        npm --prefix frontend ci --no-audit --no-fund
        npm --prefix frontend run test:browser

  integration-test:
    image: docker:27-cli
    depends_on:
      - browser-test-webkit
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      NPMRC_CONTENT:
        from_secret: npmrc_content
    commands:
      - |
        set -e
        cleanup() {
          rm -f .npmrc backend/.npmrc
          docker compose -f compose.integration-be.yaml down --volumes --remove-orphans --rmi all || true
          docker builder prune -af || true
          docker image prune -af || true
        }
        cleanup
        trap cleanup EXIT

        printf '%s\n' "$NPMRC_CONTENT" > .npmrc
        cp .npmrc backend/.npmrc  # integration service builds from ./backend context
        docker compose -f compose.integration-be.yaml build
        docker compose -f compose.integration-be.yaml up -d --wait --wait-timeout 300 db
        docker compose -f compose.integration-be.yaml run --rm migrate
        docker compose -f compose.integration-be.yaml up -d --wait --wait-timeout 300 --no-deps api
        docker compose -f compose.integration-be.yaml run --rm --no-deps integration
