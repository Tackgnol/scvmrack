# Runs on pull requests. GitHub can use this workflow status as the merge gate.

when:
  - event: pull_request

steps:
  # 1. Catch leaked secrets immediately
  secret-scan:
    image: trufflesecurity/trufflehog:latest
    commands:
      # Scans the git history of this PR for high-entropy secrets and API keys
      - trufflehog git file://. --only-verified --fail

  # 2. Scan your code logic for OWASP Top 10 vulnerabilities
  static-analysis:
    image: semgrep/semgrep
    depends_on:
      - secret-scan
    commands:
      # Runs community-driven security rules against JS/TS files
      - |
        set -e
        export SEMGREP_SRC_DIRECTORY="$CI_WORKSPACE"
        semgrep scan --config auto --error .

  # 3. Scan Dockerfiles and compose files for high-risk misconfigurations
  iac-scan:
    image: aquasec/trivy:0.70.0
    depends_on:
      - secret-scan
    commands:
      # Avoid the vulnerability scanner here; it downloads Trivy's vuln DB.
      - trivy fs --scanners misconfig --exit-code 1 --severity HIGH,CRITICAL --no-progress .

  unit-test:
    image: mcr.microsoft.com/playwright:v1.58.2-jammy
    depends_on:
      - static-analysis
      - iac-scan
    commands:
      - |
        set -e
        cleanup() {
          rm -rf node_modules client/node_modules client/public client/coverage client/coverage-unit client/coverage-browser reports
          npm cache clean --force || true
        }
        cleanup
        trap cleanup EXIT

        pwd
        ls -la package-lock.json client/package-lock.json || true

        if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
          npm ci --no-audit --no-fund
        else
          npm install --no-audit --no-fund
        fi
        npm --prefix tests/unit-be run test

        rm -rf node_modules
        npm cache clean --force || true

        npm --prefix client ci --no-audit --no-fund
        npm --prefix client run test:unit

  integration-test:
    image: docker:27-cli
    depends_on:
      - browser-test-webkit
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - |
        set -e
        cleanup() {
          docker compose -f compose.integration-be.yaml down --volumes --remove-orphans --rmi all || true
          docker builder prune -af || true
          docker image prune -af || true
        }
        cleanup
        trap cleanup EXIT
        docker compose -f compose.integration-be.yaml up \
          --build --abort-on-container-exit --exit-code-from integration \
          db api integration

  browser-test-chromium:
    image: mcr.microsoft.com/playwright:v1.58.2-jammy
    depends_on:
      - unit-test
    environment:
      VITEST_BROWSER_INSTANCES: chromium
      CI: "true"
    commands:
      - |
        set -e
        cleanup() {
          rm -rf client/node_modules client/public client/coverage client/coverage-unit client/coverage-browser
          npm cache clean --force || true
        }
        cleanup
        trap cleanup EXIT

        npm --prefix client ci --no-audit --no-fund
        npm --prefix client run test:browser

  browser-test-firefox:
    image: mcr.microsoft.com/playwright:v1.58.2-jammy
    depends_on:
      - browser-test-chromium
    environment:
      VITEST_BROWSER_INSTANCES: firefox
    commands:
      - |
        set -e
        cleanup() {
          rm -rf client/node_modules client/public client/coverage client/coverage-unit client/coverage-browser
          npm cache clean --force || true
        }
        cleanup
        trap cleanup EXIT

        npm --prefix client ci --no-audit --no-fund
        npm --prefix client run test:browser

  browser-test-webkit:
    image: mcr.microsoft.com/playwright:v1.58.2-jammy
    depends_on:
      - browser-test-firefox
    environment:
      VITEST_BROWSER_INSTANCES: webkit
    commands:
      - |
        set -e
        cleanup() {
          rm -rf client/node_modules client/public client/coverage client/coverage-unit client/coverage-browser
          npm cache clean --force || true
        }
        cleanup
        trap cleanup EXIT

        npm --prefix client ci --no-audit --no-fund
        npm --prefix client run test:browser

  e2e-test:
    image: docker:27-cli
    depends_on:
      - integration-test
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      CI: "true"
      PLAYWRIGHT_INCLUDE_REGRESSION: "1"
    commands:
      - |
        set -e
        cleanup() {
          docker compose -f compose.e2e.yaml down --volumes --remove-orphans --rmi all || true
          docker builder prune -af || true
          docker image prune -af || true
        }
        cleanup
        trap cleanup EXIT
        docker compose -f compose.e2e.yaml up \
          --build --abort-on-container-exit --exit-code-from e2e \
          db api web mailpit e2e
