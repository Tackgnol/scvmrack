# Deploys master only. Tests are reported separately on the branch / pull request.
#
# Secrets (set in Woodpecker UI, repo-scoped):
#   npmrc_content
#   database_password
#   better_auth_secret
#   logto_endpoint
#   logto_app_id
#   logto_app_secret
#   logto_redirect_uri
#   logto_post_logout_redirect_uri
#   glitchtip_dsn
#   vite_glitchtip_dsn
#   client_origin
#   client_gateway
#   app_base_url
#   auth_base_url
#   vite_backend_url
#   vite_logto_endpoint

when:
  - event: [push]
    branch: master

steps:
  deploy:
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      NPMRC_CONTENT:
        from_secret: npmrc_content
      DATABASE_PASSWORD:
        from_secret: database_password
      BETTER_AUTH_SECRET:
        from_secret: better_auth_secret
      LOGTO_ENDPOINT:
        from_secret: logto_endpoint
      LOGTO_APP_ID:
        from_secret: logto_app_id
      LOGTO_APP_SECRET:
        from_secret: logto_app_secret
      LOGTO_REDIRECT_URI:
        from_secret: logto_redirect_uri
      LOGTO_POST_LOGOUT_REDIRECT_URI:
        from_secret: logto_post_logout_redirect_uri
      GLITCHTIP_DSN:
        from_secret: glitchtip_dsn
      VITE_GLITCHTIP_DSN:
        from_secret: vite_glitchtip_dsn
      CLIENT_ORIGIN:
        from_secret: client_origin
      CLIENT_GATEWAY:
        from_secret: client_gateway
      APP_BASE_URL:
        from_secret: app_base_url
      AUTH_BASE_URL:
        from_secret: auth_base_url
      VITE_BACKEND_URL:
        from_secret: vite_backend_url
      VITE_LOGTO_ENDPOINT:
        from_secret: vite_logto_endpoint

    commands:
      - |
        set -e
        cleanup() {
          rm -f .npmrc backend/.npmrc
        }
        cleanup
        trap cleanup EXIT

        : "${NPMRC_CONTENT:?npmrc_content secret is required}"
        : "${DATABASE_PASSWORD:?database_password secret is required}"

        printf '%s\n' "$NPMRC_CONTENT" > .npmrc

        db_password_url="$(printf '%s' "$DATABASE_PASSWORD" | sed \
          -e 's|%|%25|g' \
          -e 's|#|%23|g' \
          -e 's|@|%40|g' \
          -e 's|:|%3A|g' \
          -e 's|/|%2F|g' \
          -e 's|?|%3F|g' \
          -e 's|&|%26|g' \
          -e 's|=|%3D|g' \
          -e 's|+|%2B|g' \
          -e 's| |%20|g')"
        export DATABASE_URL="postgresql://p1002_scmgrinder:${db_password_url}@db:5432/p1002_scmgrinder"

        docker compose -f compose.prod.yaml build backend frontend

        if ! docker service inspect scvmrack_db > /dev/null 2>&1; then
          COMPOSE_PROJECT_NAME=scvmrack-prod docker compose -f compose.prod.yaml down --remove-orphans || true
          BACKEND_REPLICAS=0 FRONTEND_REPLICAS=0 docker stack deploy -c compose.prod.yaml scvmrack --detach=false --resolve-image never
        fi

        deadline=$(( $(date +%s) + 180 ))
        health=""
        while [ "$(date +%s)" -lt "$deadline" ]; do
          container_id="$(docker ps --filter label=com.docker.swarm.service.name=scvmrack_db --format '{{.ID}}' | head -n 1)"
          if [ -n "$container_id" ]; then
            health="$(docker inspect "$container_id" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' 2>/dev/null || true)"
            if [ "$health" = "healthy" ]; then
              break
            fi
          fi
          sleep 3
        done

        if [ "$health" != "healthy" ]; then
          echo "Timed out waiting for scvmrack_db to become healthy" >&2
          docker stack ps scvmrack --no-trunc >&2 || true
          exit 1
        fi

        docker run --rm --network scvmrack_db \
          -e DATABASE_USER=p1002_scmgrinder \
          -e DATABASE_PASSWORD="$DATABASE_PASSWORD" \
          -e DATABASE_NAME=p1002_scmgrinder \
          -e DATABASE_HOST=db \
          -e DATABASE_PORT=5432 \
          -e DATABASE_URL="$DATABASE_URL" \
          scvmrack-backend:prod npm run prisma:migrate

        docker stack deploy -c compose.prod.yaml scvmrack --detach=false --resolve-image never
        docker stack services scvmrack
