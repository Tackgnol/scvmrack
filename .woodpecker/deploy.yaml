# Deploys master only. Tests are reported separately on the branch / pull request.
#
# Secrets (set in Woodpecker UI, repo-scoped):
#   npmrc_content
#   database_password
#   better_auth_secret
#   logto_endpoint
#   logto_app_id
#   logto_app_secret
#   logto_redirect_uri
#   logto_post_logout_redirect_uri
#   glitchtip_dsn
#   vite_glitchtip_dsn
#   client_origin
#   client_gateway
#   app_base_url
#   auth_base_url
#   vite_backend_url
#   vite_logto_endpoint

when:
  - event: [push]
    branch: master

steps:
  deploy:
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      NPMRC_CONTENT:
        from_secret: npmrc_content
      DATABASE_PASSWORD:
        from_secret: database_password
      BETTER_AUTH_SECRET:
        from_secret: better_auth_secret
      LOGTO_ENDPOINT:
        from_secret: logto_endpoint
      LOGTO_APP_ID:
        from_secret: logto_app_id
      LOGTO_APP_SECRET:
        from_secret: logto_app_secret
      LOGTO_REDIRECT_URI:
        from_secret: logto_redirect_uri
      LOGTO_POST_LOGOUT_REDIRECT_URI:
        from_secret: logto_post_logout_redirect_uri
      GLITCHTIP_DSN:
        from_secret: glitchtip_dsn
      VITE_GLITCHTIP_DSN:
        from_secret: vite_glitchtip_dsn
      CLIENT_ORIGIN:
        from_secret: client_origin
      CLIENT_GATEWAY:
        from_secret: client_gateway
      APP_BASE_URL:
        from_secret: app_base_url
      AUTH_BASE_URL:
        from_secret: auth_base_url
      VITE_BACKEND_URL:
        from_secret: vite_backend_url
      VITE_LOGTO_ENDPOINT:
        from_secret: vite_logto_endpoint

    commands:
      - |
        set -e
        cleanup() {
          rm -f .npmrc backend/.npmrc
        }
        cleanup
        trap cleanup EXIT

        : "${NPMRC_CONTENT:?npmrc_content secret is required}"
        : "${DATABASE_PASSWORD:?database_password secret is required}"

        printf '%s\n' "$NPMRC_CONTENT" > .npmrc

        # DATABASE_URL is required by compose.prod.yaml's :? guard during
        # `docker stack deploy`. The actual URL-encoded value is computed below
        # using Node (after the backend image is built) — the raw password is
        # fine here because no DB connection is attempted at this stage.
        export DATABASE_URL="postgresql://p1002_scmgrinder:placeholder@db:5432/p1002_scmgrinder"

        docker compose -f compose.prod.yaml build backend frontend

        if ! docker service inspect scvmrack_db > /dev/null 2>&1; then
          COMPOSE_PROJECT_NAME=scvmrack-prod docker compose -f compose.prod.yaml down --remove-orphans || true
          BACKEND_REPLICAS=0 FRONTEND_REPLICAS=0 docker stack deploy -c compose.prod.yaml scvmrack --detach=false --resolve-image never
        fi

        deadline=$(( $(date +%s) + 180 ))
        health=""
        while [ "$(date +%s)" -lt "$deadline" ]; do
          container_id="$(docker ps --filter label=com.docker.swarm.service.name=scvmrack_db --format '{{.ID}}' | head -n 1)"
          if [ -n "$container_id" ]; then
            health="$(docker inspect "$container_id" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' 2>/dev/null || true)"
            if [ "$health" = "healthy" ]; then
              break
            fi
          fi
          sleep 3
        done

        if [ "$health" != "healthy" ]; then
          echo "Timed out waiting for scvmrack_db to become healthy" >&2
          docker stack ps scvmrack --no-trunc >&2 || true
          exit 1
        fi

        db_container_id="$(docker ps --filter label=com.docker.swarm.service.name=scvmrack_db --format '{{.ID}}' | head -n 1)"
        if [ -z "$db_container_id" ]; then
          echo "Could not find running scvmrack_db container" >&2
          docker stack ps scvmrack --no-trunc >&2 || true
          exit 1
        fi

        # Diagnostic: hash the password from the shell and from inside the
        # backend image's node process. If these two SHA-256 prefixes differ,
        # the password is being mutated between contexts (whitespace, newline,
        # encoding) — that's the actual root cause and no URL encoding will fix it.
        echo "shell pw sha256 prefix: $(printf '%s' "$DATABASE_PASSWORD" | sha256sum | cut -c1-8) length=$(printf '%s' "$DATABASE_PASSWORD" | wc -c)"
        docker run --rm \
          -e RAW_PASS="$DATABASE_PASSWORD" \
          scvmrack-backend:prod \
          node -e 'const c=require("crypto");const p=process.env.RAW_PASS||"";console.log("node  pw sha256 prefix:",c.createHash("sha256").update(p).digest("hex").slice(0,8),"length="+p.length)'

        # Sync the role password to the current secret. Use a temp SQL file
        # so psql variable substitution works (`-c` does not support `:'var'`).
        printf "ALTER USER p1002_scmgrinder WITH PASSWORD :'db_password';\n" > /tmp/sync-pw.sql
        docker cp /tmp/sync-pw.sql "$db_container_id:/tmp/sync-pw.sql"
        docker exec "$db_container_id" psql \
          -U p1002_scmgrinder \
          -d p1002_scmgrinder \
          -v ON_ERROR_STOP=1 \
          -v "db_password=$DATABASE_PASSWORD" \
          -f /tmp/sync-pw.sql

        # Diagnostic: probe with vanilla psql from the same network using the
        # same credentials. If this works but Prisma still fails, it's a URL
        # parsing issue. If this fails too, `db` resolves to a different
        # postgres than the one we just ALTERed, OR the role's password isn't
        # what we think it is.
        echo "=== psql probe: hostname 'db' ==="
        docker run --rm --network scvmrack_db \
          -e PGPASSWORD="$DATABASE_PASSWORD" \
          postgres:16-alpine \
          psql -h db -U p1002_scmgrinder -d p1002_scmgrinder -c 'select current_user, inet_server_addr();' || echo "psql via 'db' FAILED"

        echo "=== psql probe: hostname 'scvmrack_db' ==="
        docker run --rm --network scvmrack_db \
          -e PGPASSWORD="$DATABASE_PASSWORD" \
          postgres:16-alpine \
          psql -h scvmrack_db -U p1002_scmgrinder -d p1002_scmgrinder -c 'select current_user, inet_server_addr();' || echo "psql via 'scvmrack_db' FAILED"

        # URL-encode the password using Node's encodeURIComponent (RFC 3986 compliant).
        db_password_url="$(docker run --rm \
          -e RAW_PASS="$DATABASE_PASSWORD" \
          scvmrack-backend:prod \
          node -e 'process.stdout.write(encodeURIComponent(process.env.RAW_PASS))')"
        DATABASE_URL="postgresql://p1002_scmgrinder:${db_password_url}@db:5432/p1002_scmgrinder"
        export DATABASE_URL

        echo "url char count: $(printf '%s' "$DATABASE_URL" | wc -c)"
        echo "encoded pw char count: $(printf '%s' "$db_password_url" | wc -c)"

        # Diagnostic: connect with node-pg (which the backend image has installed)
        # using the SAME DATABASE_URL Prisma will use. If pg works and Prisma fails,
        # the bug is inside Prisma's URL handling, not our string.
        echo "=== node-pg probe via DATABASE_URL ==="
        docker run --rm --network scvmrack_db \
          -e DATABASE_URL="$DATABASE_URL" \
          scvmrack-backend:prod \
          node -e '
            const {Client} = require("pg");
            const c = new Client({connectionString: process.env.DATABASE_URL});
            c.connect()
              .then(()=>c.query("select current_user"))
              .then(r=>{console.log("pg ok:", r.rows[0]); return c.end();})
              .catch(e=>{console.error("pg FAIL:", e.message); process.exit(1);});
          ' || echo "node-pg probe FAILED"

        docker run --rm --network scvmrack_db \
          -e DATABASE_USER=p1002_scmgrinder \
          -e DATABASE_PASSWORD="$DATABASE_PASSWORD" \
          -e DATABASE_NAME=p1002_scmgrinder \
          -e DATABASE_HOST=db \
          -e DATABASE_PORT=5432 \
          -e DATABASE_URL="$DATABASE_URL" \
          scvmrack-backend:prod npm run prisma:migrate

        docker stack deploy -c compose.prod.yaml scvmrack --detach=false --resolve-image never
        docker stack services scvmrack
