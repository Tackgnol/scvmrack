# Deploys master only. Tests are reported separately on the branch / pull request.
#
# Secrets (set in Woodpecker UI, repo-scoped):
#   npmrc_content
#   database_password
#   better_auth_secret
#   logto_endpoint
#   logto_app_id
#   logto_app_secret
#   logto_redirect_uri
#   logto_post_logout_redirect_uri
#   glitchtip_dsn
#   vite_glitchtip_dsn
#   client_origin
#   client_gateway
#   app_base_url
#   auth_base_url
#   vite_backend_url
#   vite_logto_endpoint

when:
  - event: [push]
    branch: master

steps:
  deploy:
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      NPMRC_CONTENT:
        from_secret: npmrc_content
      DATABASE_PASSWORD:
        from_secret: database_password
      BETTER_AUTH_SECRET:
        from_secret: better_auth_secret
      LOGTO_ENDPOINT:
        from_secret: logto_endpoint
      LOGTO_APP_ID:
        from_secret: logto_app_id
      LOGTO_APP_SECRET:
        from_secret: logto_app_secret
      LOGTO_REDIRECT_URI:
        from_secret: logto_redirect_uri
      LOGTO_POST_LOGOUT_REDIRECT_URI:
        from_secret: logto_post_logout_redirect_uri
      GLITCHTIP_DSN:
        from_secret: glitchtip_dsn
      VITE_GLITCHTIP_DSN:
        from_secret: vite_glitchtip_dsn
      CLIENT_ORIGIN:
        from_secret: client_origin
      CLIENT_GATEWAY:
        from_secret: client_gateway
      APP_BASE_URL:
        from_secret: app_base_url
      AUTH_BASE_URL:
        from_secret: auth_base_url
      VITE_BACKEND_URL:
        from_secret: vite_backend_url
      VITE_LOGTO_ENDPOINT:
        from_secret: vite_logto_endpoint

    commands:
      - |
        set -e
        cleanup() {
          rm -f .npmrc backend/.npmrc
        }
        cleanup
        trap cleanup EXIT

        : "${NPMRC_CONTENT:?npmrc_content secret is required}"
        : "${DATABASE_PASSWORD:?database_password secret is required}"

        printf '%s\n' "$NPMRC_CONTENT" > .npmrc

        # DATABASE_URL is required by compose.prod.yaml's :? guard during
        # `docker stack deploy`. The actual URL-encoded value is computed below
        # using Node (after the backend image is built) — the raw password is
        # fine here because no DB connection is attempted at this stage.
        export DATABASE_URL="postgresql://p1002_scmgrinder:placeholder@db:5432/p1002_scmgrinder"

        docker compose -f compose.prod.yaml build backend frontend

        if ! docker service inspect scvmrack_db > /dev/null 2>&1; then
          COMPOSE_PROJECT_NAME=scvmrack-prod docker compose -f compose.prod.yaml down --remove-orphans || true
          BACKEND_REPLICAS=0 FRONTEND_REPLICAS=0 docker stack deploy -c compose.prod.yaml scvmrack --detach=false --resolve-image never
        fi

        deadline=$(( $(date +%s) + 180 ))
        health=""
        while [ "$(date +%s)" -lt "$deadline" ]; do
          container_id="$(docker ps --filter label=com.docker.swarm.service.name=scvmrack_db --format '{{.ID}}' | head -n 1)"
          if [ -n "$container_id" ]; then
            health="$(docker inspect "$container_id" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' 2>/dev/null || true)"
            if [ "$health" = "healthy" ]; then
              break
            fi
          fi
          sleep 3
        done

        if [ "$health" != "healthy" ]; then
          echo "Timed out waiting for scvmrack_db to become healthy" >&2
          docker stack ps scvmrack --no-trunc >&2 || true
          exit 1
        fi

        db_container_id="$(docker ps --filter label=com.docker.swarm.service.name=scvmrack_db --format '{{.ID}}' | head -n 1)"
        if [ -z "$db_container_id" ]; then
          echo "Could not find running scvmrack_db container" >&2
          docker stack ps scvmrack --no-trunc >&2 || true
          exit 1
        fi

        # Sync the db role password to the current secret. The Postgres data
        # directory persists in pgdata, so POSTGRES_PASSWORD only takes effect
        # on first init — after that, the secret can drift from the role's
        # actual stored password and Prisma will fail with P1000.
        # Use a temp SQL file because psql `-c` doesn't support `:'var'`.
        printf "ALTER USER p1002_scmgrinder WITH PASSWORD :'db_password';\n" > /tmp/sync-pw.sql
        docker cp /tmp/sync-pw.sql "$db_container_id:/tmp/sync-pw.sql"
        docker exec "$db_container_id" psql \
          -U p1002_scmgrinder \
          -d p1002_scmgrinder \
          -v ON_ERROR_STOP=1 \
          -v "db_password=$DATABASE_PASSWORD" \
          -f /tmp/sync-pw.sql

        # Build DATABASE_URL inside Node so encodeURIComponent handles every
        # URL-reserved character correctly. `tr -d '\r\n'` strips the trailing
        # CR that `docker run` adds in this CI environment — without it the
        # captured value carried a stray \r that broke shell concatenation,
        # producing a URL with an empty password slot.
        DATABASE_URL="$(docker run --rm \
          -e RAW_PASS="$DATABASE_PASSWORD" \
          -e DB_USER=p1002_scmgrinder \
          -e DB_HOST=db \
          -e DB_PORT=5432 \
          -e DB_NAME=p1002_scmgrinder \
          scvmrack-backend:prod \
          node -e 'process.stdout.write("postgresql://"+encodeURIComponent(process.env.DB_USER)+":"+encodeURIComponent(process.env.RAW_PASS)+"@"+process.env.DB_HOST+":"+process.env.DB_PORT+"/"+process.env.DB_NAME)' \
          | tr -d '\r\n')"
        export DATABASE_URL

        docker run --rm --network scvmrack_db \
          -e DATABASE_URL="$DATABASE_URL" \
          scvmrack-backend:prod npx prisma db push --accept-data-loss --skip-generate

        docker stack deploy -c compose.prod.yaml scvmrack --detach=false --resolve-image never
        docker stack services scvmrack
