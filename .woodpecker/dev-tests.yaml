# Runs on the integration branch. Keep this fast: unit + backend integration.

when:
  - event: push
    branch: dev

steps:
  unit-test:
    image: node:22-alpine
    environment:
      NPMRC_CONTENT:
        from_secret: npmrc_content
    commands:
      - |
        set -e
        cleanup() {
          rm -f .npmrc backend/.npmrc
          rm -rf backend/node_modules frontend/node_modules frontend/dist frontend/coverage frontend/coverage-unit frontend/coverage-browser reports
          npm cache clean --force || true
        }
        cleanup
        trap cleanup EXIT

        printf '%s\n' "$NPMRC_CONTENT" > .npmrc
        cp .npmrc backend/.npmrc
        npm --prefix backend ci --no-audit --no-fund
        rm -f .npmrc backend/.npmrc
        npm --prefix backend/tests/unit-be run test

        npm --prefix frontend ci --no-audit --no-fund
        npm --prefix frontend run test:unit

  integration-test:
    image: docker:27-cli
    depends_on:
      - unit-test
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      NPMRC_CONTENT:
        from_secret: npmrc_content
    commands:
      - |
        set -e
        cleanup() {
          rm -f .npmrc backend/.npmrc
          docker compose -f compose.integration-be.yaml down --volumes --remove-orphans || true
          docker builder prune -af || true
          docker image prune -f || true
        }
        cleanup
        trap cleanup EXIT

        printf '%s\n' "$NPMRC_CONTENT" > .npmrc
        docker compose -f compose.integration-be.yaml up \
          --build --abort-on-container-exit --exit-code-from integration \
          db migrate api integration
