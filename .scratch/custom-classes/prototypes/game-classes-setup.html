<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Classes Setup Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;1,400&family=Antonio:wght@400;700&family=Bebas+Neue&family=MedievalSharp&display=swap">
<style>
/* PROTOTYPE, throwaway. Wayfinder ticket 06: the GM screen's game classes setup (Party Class Pool) and the
   read-only class detail page (ticket 20). Owner picked variant B (switchboard), 2026-09-27, with:
   a bone-and-skull switch, info on hover/focus, richer rows, and filters that open their sections.
   Mimics PartyPage.tsx (stamp, title, dark panels with pink offset shadow). Nothing is saved. */
:root{
  --yellow:#FFE900; --pink:#FF3EB5; --black:#0a0a0a; --off-black:#111; --grey:#1a1a1a; --dark-grey:#2a2a2a;
  --white:#f5f5f5; --muted:#888; --blood:#8b0000;
  --f-head:'Bebas Neue','Arial Narrow',sans-serif; --f-label:'Antonio','Arial Narrow',sans-serif;
  --f-body:'Alegreya',Georgia,serif; --f-gothic:'MedievalSharp',Georgia,serif; --tap:44px;
}
*{box-sizing:border-box;border-radius:0}
html,body{background:var(--yellow)}
body{margin:0;color:var(--black);font-family:var(--f-body);font-size:.9rem;line-height:1.5;padding:0 16px 120px}
@media (max-width:600px){body{font-size:1rem}}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--black);outline-offset:2px}
.panel :focus-visible,.detail .panel :focus-visible{outline-color:var(--yellow)}
.wrap{max-width:980px;margin:0 auto;display:grid;gap:16px;padding-top:16px}
.stamp{display:inline-block;width:fit-content;background:var(--pink);color:var(--black);font-family:var(--f-label);font-size:.75rem;letter-spacing:.24em;text-transform:uppercase;padding:2px 8px}
h1{font-family:var(--f-head);font-size:clamp(2.6rem,7vw,3.3rem);line-height:.95;letter-spacing:.04em;margin:6px 0 0;font-weight:400;text-transform:uppercase}
.panel{background:var(--black);color:var(--white);border:3px solid var(--black);box-shadow:6px 6px 0 var(--pink);padding:16px;display:grid;gap:12px}
@media (max-width:600px){.panel{padding:12px}}
.label{color:var(--pink);font-family:var(--f-label);font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;margin:0}
.label.ink{color:var(--black)}
.muted{color:var(--muted)}
.hint{font-style:italic;color:var(--muted);margin:0;max-width:36em}
.spread{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.act{font-family:var(--f-label);font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;background:transparent;color:var(--yellow);border:1px solid var(--yellow);padding:4px 10px;min-height:36px;cursor:pointer}
.act:hover,.act.on{background:var(--yellow);color:var(--black)}
@media (pointer:coarse){.act{min-height:var(--tap)}}
.chip{display:inline-block;font-family:var(--f-label);font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--dark-grey);color:var(--white);white-space:nowrap}
.chip.on{background:var(--yellow);color:var(--black);border-color:var(--yellow)}
.chip.warn{background:var(--pink);color:var(--black);border-color:var(--pink)}
.attr{font-family:var(--f-body);font-style:italic;color:var(--muted);font-size:.9rem}
.notice{background:var(--pink);color:var(--black);border:2px solid var(--black);padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.notice p{margin:0;max-width:60ch}
.notice .act{color:var(--black);border-color:var(--black)}
.notice .act:hover{background:var(--black);color:var(--pink)}
.readonly{border:1px dashed var(--yellow);padding:8px 12px;font-family:var(--f-label);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--yellow);margin:0}
.status{font-family:var(--f-label);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);min-height:1.4em}
.linkish{background:none;border:0;padding:0;color:var(--white);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font:inherit;text-align:left}
.linkish:hover{color:var(--yellow)}
.search{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search input[type=search]{flex:1 1 220px;min-height:var(--tap);background:var(--grey);border:2px solid var(--dark-grey);color:var(--white);padding:6px 10px}
.search input[type=search]:focus{border-color:var(--yellow);outline:none}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--yellow)}
.seg .act{border:0}
.seg .act + .act{border-left:1px solid var(--yellow)}

/* the bone-and-skull switch: a skull slides along a bone; dim when off, a yellow bone with a black skull when on */
.bone{display:inline-flex;align-items:center;gap:10px;background:none;border:0;padding:6px 0;cursor:pointer;min-height:var(--tap);color:var(--white);font-family:var(--f-label);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;text-align:left}
.bone svg{width:76px;height:34px;flex:none;overflow:visible}
.bone .shaft{fill:var(--dark-grey);stroke:var(--muted);stroke-width:1.2}
.bone .skull{transform:translateX(0);transition:transform .14s cubic-bezier(.2,.8,.2,1)}
.bone .cranium{fill:var(--muted)} .bone .socket{fill:var(--black)}
.bone[aria-checked="true"] .shaft{fill:var(--yellow);stroke:var(--black)}
.bone[aria-checked="true"] .skull{transform:translateX(36px)}
.bone[aria-checked="true"] .cranium{fill:var(--black)} .bone[aria-checked="true"] .socket{fill:var(--yellow)}
.bone:hover .shaft{stroke:var(--yellow)}
.bone:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}
.bone[aria-disabled="true"]{cursor:not-allowed}
.bone[aria-disabled="true"] .shaft{fill:transparent;stroke:var(--dark-grey);stroke-dasharray:3 2}
.bone[aria-disabled="true"] .cranium{fill:var(--dark-grey)}

/* switchboard */
.b-bar{background:var(--black);padding:8px 0;display:grid;gap:8px}
@media (min-width:700px){.b-bar{position:sticky;top:0;z-index:3}}
.summary{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.b-group{border-top:2px solid var(--dark-grey)}
.b-group > button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;background:none;border:0;color:var(--white);padding:10px 0;cursor:pointer;min-height:var(--tap);text-align:left}
.b-group > button .gname{font-family:var(--f-head);font-size:1.5rem;letter-spacing:.03em;text-transform:uppercase;color:var(--yellow)}
.b-group > button .gdesc{font-style:italic;color:var(--muted);flex:1;min-width:0}
.b-group > button{flex-wrap:wrap}
@media (max-width:700px){.b-group > button .gname{flex:1}.b-group > button .gdesc{order:9;flex-basis:100%}}
.b-group > button svg{width:14px;height:14px;transition:transform .12s}
.b-group > button[aria-expanded="true"] svg{transform:rotate(180deg)}
.b-row{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,15em);gap:4px 14px;align-items:center;padding:8px 6px;border-top:1px solid var(--grey)}
.b-row:hover,.b-row:focus-within{background:var(--off-black)}
.b-row .who{display:grid;gap:2px;min-width:0}
.b-row .meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.cname{font-family:var(--f-gothic);font-size:1.15rem;line-height:1.2}
.blurb{color:#bbb;font-size:.9rem;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.shape{display:grid;gap:2px;justify-items:end;text-align:right;font-family:var(--f-label);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.shape b{color:var(--white);font-weight:400}
.shape .playing{color:var(--yellow)}
@media (max-width:700px){.b-row{grid-template-columns:auto minmax(0,1fr)}.shape{grid-column:2;justify-items:start;text-align:left}}
/* hover / focus card */
.info{position:absolute;z-index:4;left:92px;top:calc(100% - 4px);width:min(380px,calc(100vw - 60px));background:var(--grey);border:2px solid var(--yellow);box-shadow:4px 4px 0 var(--pink);padding:12px;display:none;gap:8px;color:var(--white)}
.b-row:hover .info,.b-row:focus-within .info{display:grid}
.info .cname{font-size:1.3rem}
.info dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:.9rem}
.info dt{font-family:var(--f-label);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--pink);padding-top:3px}
.info dd{margin:0}
@media (hover:none){.b-row:hover .info{display:none}}
@media (max-width:700px){.info{left:6px}}

/* class detail page (ticket 20) */
.detail{position:fixed;inset:0;z-index:40;background:var(--yellow);overflow:auto;padding:16px}
.detail .sheet{max-width:760px;margin:0 auto;display:grid;gap:14px}
.detail h2{font-family:var(--f-gothic);font-weight:400;font-size:2rem;margin:0;line-height:1.1}
.detail .panel h3{font-family:var(--f-head);font-weight:400;font-size:1.5rem;letter-spacing:.03em;text-transform:uppercase;color:var(--yellow);margin:0}
.detail ul{margin:0;padding-left:18px}

.stub{display:flex;justify-content:space-between;align-items:center}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.member{background:var(--black);color:var(--white);padding:10px;border:2px solid var(--black);display:grid;gap:4px}
.member b{font-family:var(--f-gothic);font-weight:400;font-size:1.05rem}
.proto-bar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:50;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;background:var(--white);color:var(--black);border:3px solid var(--black);box-shadow:4px 4px 0 var(--black);padding:6px 8px;max-width:calc(100vw - 24px)}
.proto-bar b{font-family:var(--f-label);letter-spacing:.15em;text-transform:uppercase;font-size:.7rem}
.proto-bar button{font-family:var(--f-label);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;border:2px solid var(--black);background:transparent;padding:4px 8px;min-height:36px;cursor:pointer}
.proto-bar button.on{background:var(--black);color:var(--yellow)}
.proto-state{background:var(--off-black);color:#ddd;font:11px/1.4 monospace;white-space:pre-wrap;padding:10px;max-height:220px;overflow:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<main class="wrap" id="app"></main>
<div id="announce" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></div>

<script>
(() => {
const ME = 'Adam';
// abilities/items/gb/playing: the class shape shown in each row and in the hover card
const CLASSES = [
  { id: 1, src: 'book', name: 'Fanged Deserter', langs: ['en', 'pl'], ab: 7, items: 0, gb: 'Book rules', playing: 1, blurb: 'Thirty or so friends who never let you down: your teeth.' },
  { id: 2, src: 'book', name: 'Gutterborn Scum', langs: ['en', 'pl'], ab: 6, items: 0, gb: 'Specialist', playing: 0, blurb: 'An ill star smiled upon your birth. Poverty, crime and bad parenting didn’t help.' },
  { id: 3, src: 'book', name: 'Esoteric Hermit', langs: ['en', 'pl'], ab: 7, items: 0, gb: 'Book rules', playing: 0, blurb: 'The stone of your cave is one with the stars. Silence and perfection.' },
  { id: 4, src: 'book', name: 'Wretched Royalty', langs: ['en', 'pl'], ab: 6, items: 0, gb: 'Book rules', playing: 0, blurb: 'Bowed down only by the memories of your own lost glory.' },
  { id: 5, src: 'book', name: 'Heretical Priest', langs: ['en', 'pl'], ab: 7, items: 0, gb: 'Book rules', playing: 0, blurb: 'Hunted by the Two-Headed Basilisks of the One True Faith.' },
  { id: 6, src: 'book', name: 'Occult Herbmaster', langs: ['en', 'pl'], ab: 7, items: 0, gb: 'Book rules', playing: 0, blurb: 'Born of the mushroom, raised in the glade, watched by the moon.' },
  { id: 20, src: 'zine', name: 'Ossuary Knight', langs: ['en'], ab: 6, items: 2, gb: 'Book rules + a new ability', playing: 0, credit: 'from Terrible Dungeons and Awesome Heroes by Toby McDungeonface', blurb: 'Armoured in the bones of better knights.' },
  { id: 21, src: 'rack', name: 'Mire Pilgrim', langs: ['en', 'pl'], ab: 5, items: 1, gb: 'Book rules', playing: 0, credit: 'from the Rack by scvmrack', blurb: 'Walks the bog roads no map admits to.' },
  { id: 100, src: 'mine', name: 'Pale Ossuary Keeper', langs: ['en', 'pl'], ab: 5, items: 3, gb: 'Specialist', playing: 2, author: ME, version: 3, blurb: 'You swept the bone-halls of Galgenbeck until the dead started answering back.' },
  { id: 101, src: 'mine', name: 'Bog Witch', langs: ['en'], ab: 4, items: 1, gb: 'Book rules', playing: 0, author: ME, version: 1, private: true, blurb: 'The mire keeps what you give it, and gives back worse.' },
  { id: 200, src: 'public', name: 'Carrion Saint', langs: ['pl'], ab: 6, items: 1, gb: 'Book rules + a new ability', playing: 0, author: 'Morbid Marta', version: 2, blurb: 'Święta padlina, która wciąż się modli.' },
  { id: 201, src: 'public', name: 'Tollgate Hag', langs: ['en', 'pl'], ab: 8, items: 2, gb: 'Book rules', playing: 0, author: 'Dread Rafał', version: 5, blurb: 'Nobody crosses the bridge without paying something.' },
  { id: 202, src: 'public', name: 'Chain Monk', langs: ['en'], ab: 5, items: 0, gb: 'Specialist', playing: 0, author: 'Grimsby', version: 1, blurb: 'Every link a sin, every sin a link.' },
];
const GROUPS = [
  ['book', 'Book Classes', 'The six from the MÖRK BORG book.'],
  ['zine', 'Zine Classes', 'From third-party zines, credited to their authors.'],
  ['rack', 'Rack Classes', 'Made by scvmrack for the community.'],
  ['mine', 'My classes', 'Forged by you. Private ones only reach your own warbands.'],
  ['public', "Other GMs' public classes", 'Shared by other GMs; they always use the latest version.'],
];
const FILTER_GROUPS = { book: ['book'], zr: ['zine', 'rack'], mine: ['mine'], public: ['public'] };
const REMOVED = { name: "Grave Warden's Due", by: 'Morbid Marta', why: 'archived by its author' };

const ui = {
  pool: new Set([1, 2, 3, 4, 5, 6, 100]), classless: true,
  query: '', filter: 'all', lang: 'any',
  showNotice: true, unclaimed: false, openGroups: new Set(['book', 'mine']), detail: null, status: '',
};
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const byId = (id) => CLASSES.find((c) => c.id === id);
function announce(m) { const el = document.getElementById('announce'); el.textContent = ''; setTimeout(() => { el.textContent = m; }, 30); }
const LANG = { en: 'English', pl: 'Polish' };
const attribution = (c) => c.src === 'book' ? '' : c.credit ? c.credit : c.src === 'mine' ? `created by you${c.private ? ' · private' : ''}` : `created by ${c.author}`;
const langChip = (c) => `<span class="chip" title="Written in ${c.langs.map((l) => LANG[l]).join(' and ')}">${c.langs.join(' · ').toUpperCase()}</span>`;
const plural = (n, w) => `${n} ${n === 1 ? w : w.endsWith('s') ? `${w}es` : `${w}s`}`;
const ro = () => ui.unclaimed;
const pooled = () => CLASSES.filter((c) => ui.pool.has(c.id));
function visible() {
  const q = ui.query.trim().toLowerCase();
  return CLASSES.filter((c) => (ui.filter === 'all' || FILTER_GROUPS[ui.filter].includes(c.src))
    && (ui.lang === 'any' || c.langs.includes(ui.lang))
    && (!q || `${c.name} ${attribution(c)} ${c.blurb}`.toLowerCase().includes(q)));
}
// the bone: a rounded shaft with knuckled ends; the skull slides from the left end to the right
const BONE = `<svg viewBox="0 0 68 30" aria-hidden="true">
  <path class="shaft" d="M13 11.5h42a4.6 4.6 0 1 1 5.2 3.5 4.6 4.6 0 1 1-5.2 3.5H13a4.6 4.6 0 1 1-5.2-3.5A4.6 4.6 0 1 1 13 11.5z"/>
  <g class="skull"><path class="cranium" d="M16 4.5a8.5 8.2 0 0 1 8.5 8.2c0 3-1.4 4.9-3 6v3.6a1.4 1.4 0 0 1-1.4 1.4h-8.2a1.4 1.4 0 0 1-1.4-1.4v-3.6c-1.6-1.1-3-3-3-6A8.5 8.2 0 0 1 16 4.5z"/>
    <ellipse class="socket" cx="12.6" cy="13" rx="2.3" ry="2.6"/><ellipse class="socket" cx="19.4" cy="13" rx="2.3" ry="2.6"/>
    <path class="socket" d="M16 16.2l1.3 2.2h-2.6z"/><rect class="socket" x="13.6" y="21" width="1.2" height="2.4"/><rect class="socket" x="17.2" y="21" width="1.2" height="2.4"/></g></svg>`;
const bone = (on, act, v, label, text = '') => `<button type="button" class="bone" role="switch" aria-checked="${on}" aria-label="${esc(label)}" ${ro() ? 'aria-disabled="true"' : ''} data-act="${act}" ${v != null ? `data-v="${v}"` : ''}>${BONE}${text}</button>`;
function toggle(id) {
  if (ro()) return;
  const c = byId(id), on = !ui.pool.has(id);
  if (on) ui.pool.add(id); else ui.pool.delete(id);
  ui.status = `${c.name} ${on ? 'added to' : 'removed from'} the pool. Saved.`;
  announce(ui.status);
}
const CHEV = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"/></svg>';

function infoCard(c) {
  return `<div class="info" role="tooltip" id="info-${c.id}"><span class="cname">${esc(c.name)}</span><p style="margin:0">${esc(c.blurb)}</p>
    <dl><dt>Abilities</dt><dd>${c.ab}, 1 rolled from the random pool</dd>
      <dt>Class Items</dt><dd>${c.items ? plural(c.items, 'item') : 'none'}</dd>
      <dt>Getting Better</dt><dd>${esc(c.gb)}</dd>
      <dt>Written in</dt><dd>${c.langs.map((l) => LANG[l]).join(' and ')}</dd>
      ${c.version ? `<dt>Version</dt><dd>${c.version}${c.src === 'public' ? ' (you always get the latest)' : ''}</dd>` : ''}
      <dt>Here</dt><dd>${c.playing ? `${plural(c.playing, 'scvm')} in this warband play it` : 'nobody in this warband plays it'}</dd></dl>
    ${attribution(c) ? `<span class="attr">${esc(attribution(c))}</span>` : ''}</div>`;
}
function rowHtml(c) {
  const on = ui.pool.has(c.id);
  return `<div class="b-row">${bone(on, 'switch', c.id, `${c.name} in the pool`)}
    <div class="who"><button type="button" class="linkish cname" data-act="detail" data-v="${c.id}" aria-describedby="info-${c.id}">${esc(c.name)}</button>
      <span class="blurb">${esc(c.blurb)}</span>
      <div class="meta">${langChip(c)}${attribution(c) ? `<span class="attr">${esc(attribution(c))}</span>` : ''}</div></div>
    <div class="shape"><span><b>${c.ab}</b> abilities · <b>${c.items}</b> Class Items</span><span>${esc(c.gb)}</span>${c.playing ? `<span class="playing">${plural(c.playing, 'scvm')} play it here</span>` : ''}</div>
    ${infoCard(c)}</div>`;
}
function panelHtml() {
  const vis = visible();
  const f = [['all', 'All'], ['book', 'Book'], ['zr', 'Zine & Rack'], ['mine', 'My classes only'], ['public', 'Public']];
  const l = [['any', 'Any language'], ['en', 'EN'], ['pl', 'PL']];
  const pool = pooled();
  const groups = GROUPS.map(([g, title, desc]) => {
    const all = CLASSES.filter((c) => c.src === g), shown = vis.filter((c) => c.src === g);
    if (!shown.length) return '';
    const on = all.filter((c) => ui.pool.has(c.id)).length;
    const open = ui.openGroups.has(g) || ui.query.trim();
    return `<div class="b-group"><button type="button" data-act="group" data-v="${g}" aria-expanded="${!!open}"><span class="gname">${title}</span><span class="gdesc">${desc}</span><span class="chip ${on ? 'on' : ''}">${on} of ${all.length} on</span>${CHEV}</button>
      ${open ? shown.map(rowHtml).join('') : ''}</div>`;
  }).join('');
  return `${ui.showNotice ? `<div class="notice" role="status"><p><b>“${esc(REMOVED.name)}”</b> has been removed by ${esc(REMOVED.by)} (${esc(REMOVED.why)}). It's no longer in this pool; scvm already playing it keep it.</p><button type="button" class="act" data-act="dismiss">Got it</button></div>` : ''}
    ${ro() ? '<p class="readonly">Owlbear room party with no GM yet: it rolls the default pool (Book Classes, Classless). Claim it from inside the room to change it.</p>' : ''}
    ${pool.length === 0 && !ui.classless ? '<p class="notice" style="margin:0" role="alert">Nobody can roll a scvm with an empty pool. Keep at least one class or Classless on.</p>' : ''}
    <div class="b-bar"><div class="search"><input type="search" placeholder="Search classes, authors or blurbs" aria-label="Search classes" value="${esc(ui.query)}" data-act="query">
      <div class="seg" role="radiogroup" aria-label="Show">${f.map(([v, t]) => `<button type="button" class="act ${ui.filter === v ? 'on' : ''}" role="radio" aria-checked="${ui.filter === v}" data-act="filter" data-v="${v}">${t}</button>`).join('')}</div>
      <div class="seg" role="radiogroup" aria-label="Language">${l.map(([v, t]) => `<button type="button" class="act ${ui.lang === v ? 'on' : ''}" role="radio" aria-checked="${ui.lang === v}" data-act="lang" data-v="${v}">${t}</button>`).join('')}</div></div>
      <div class="spread">${bone(ui.classless, 'classless', null, 'Enable classless scvm', 'Enable classless scvm')}
        <p class="summary" aria-label="Pool summary"><span class="chip on">${plural(pool.length, 'class')} on</span>${GROUPS.map(([g, t]) => { const n = pool.filter((c) => c.src === g).length; return n ? `<span class="chip">${n} ${{ book: 'Book', zine: 'Zine', rack: 'Rack', mine: 'mine', public: 'public' }[g]}</span>` : ''; }).join('')}${ui.classless ? '<span class="chip">+ Classless</span>' : ''}</p></div></div>
    ${groups || '<p class="hint">Nothing matches that search.</p>'}
    <p class="hint">Players see ${plural(pool.length, 'class')}${ui.classless ? ' and Classless' : ''}. Random picks evenly among the classes; it never picks Classless.</p>`;
}
function detailHtml() {
  const c = byId(ui.detail);
  const custom = c.src === 'mine' || c.src === 'public';
  return `<div class="detail" role="dialog" aria-modal="true" aria-labelledby="d-title"><div class="sheet">
    <div class="spread"><span class="stamp">${{ book: 'Book', zine: 'Zine', rack: 'Rack', mine: 'Your', public: 'Public' }[c.src]} class</span><button type="button" class="act" style="color:var(--black);border-color:var(--black)" data-act="detail-close">Back to the warband</button></div>
    <h2 id="d-title">${esc(c.name)}</h2>
    ${attribution(c) ? `<p class="attr" style="color:var(--black);margin:0">${esc(attribution(c))}${custom ? ` · version ${c.version}` : ''}</p>` : ''}
    ${c.langs.length === 1 ? `<p class="hint" style="color:var(--black)">This class is written in ${LANG[c.langs[0]]}.</p>` : ''}
    <div class="panel"><p style="margin:0">${esc(c.blurb)}</p></div>
    <div class="panel"><h3>Abilities · ${c.ab}</h3><ul><li><b>Bone-Reader</b> <span class="chip">Fixed</span>: once per day ask a skull one question.</li><li><b>Reliquary Flail</b> <span class="chip">Random</span>: grants weapon 1d6 · melee.</li><li><b>Litany of Bones</b> <span class="chip">Random</span>: d4 table.</li></ul></div>
    <div class="panel"><h3>Class Items · ${c.items}</h3>${c.items ? '<ul><li><b>Reliquary Flail</b>: weapon · 1d6 · melee</li></ul>' : '<p class="hint">None.</p>'}</div>
    <div class="panel"><h3>Getting Better</h3><p style="margin:0">${esc(c.gb)}</p></div>
    ${c.src === 'public' ? '<p style="margin:0"><button type="button" class="linkish" style="color:var(--black)" data-act="report">Report this class</button></p>' : ''}
  </div></div>`;
}
function render() {
  const a = document.activeElement;
  const focusSel = a && a.dataset && a.dataset.act ? `[data-act="${a.dataset.act}"]${a.dataset.v ? `[data-v="${a.dataset.v}"]` : ''}` : null;
  document.getElementById('app').innerHTML = `
    <div><span class="stamp">GM party control</span><h1>The Grave Wardens</h1></div>
    <div class="panel stub"><p class="label">Invite link</p><span class="muted">(collapsed)</span></div>
    <div><p class="label ink">Warband · 3/10</p><div class="members">
      <div class="member"><b>Ulv the Unwashed</b><span class="attr">Pale Ossuary Keeper</span></div>
      <div class="member"><b>Sister Mold</b><span class="attr">Pale Ossuary Keeper</span><span class="chip warn" title="Rolled with version 2; the class is now on version 3">Older rules</span></div>
      <div class="member"><b>Karg</b><span class="attr">Fanged Deserter</span></div></div></div>
    <section class="panel" aria-labelledby="classes-title">
      <div class="spread"><p class="label" id="classes-title">Classes this warband can roll</p><span class="status" role="status">${esc(ui.status)}</span></div>
      <p class="hint">Players who join through the invite link or this Owlbear room pick from this pool. Changes save at once; scvm already playing a class keep it. Hover or focus a class for details.</p>
      ${panelHtml()}
    </section>
    <div class="panel stub"><p class="label">Guild</p><span class="muted">(unchanged)</span></div>
    <details><summary class="label ink">Prototype: pool state</summary><pre class="proto-state">${esc(JSON.stringify({ pool: pooled().map((c) => c.name), classless: ui.classless, filter: ui.filter, open: [...ui.openGroups], unclaimedRoomParty: ui.unclaimed }, null, 2))}</pre></details>
    ${ui.detail ? detailHtml() : ''}
    <div class="proto-bar" role="toolbar" aria-label="Prototype controls"><b>Prototype</b>
      <button type="button" data-act="toggle-notice" class="${ui.showNotice ? 'on' : ''}">Removed notice</button><button type="button" data-act="toggle-unclaimed" class="${ui.unclaimed ? 'on' : ''}">Unclaimed room</button></div>`;
  if (focusSel) { const el = document.querySelector(focusSel); if (el) el.focus({ preventScroll: true }); }
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled || b.getAttribute('aria-disabled') === 'true') return;
  const v = b.dataset.v, id = Number(v);
  switch (b.dataset.act) {
    case 'toggle-notice': ui.showNotice = !ui.showNotice; break;
    case 'toggle-unclaimed': ui.unclaimed = !ui.unclaimed; if (ui.unclaimed) { ui.pool = new Set([1, 2, 3, 4, 5, 6]); ui.classless = true; } break;
    case 'dismiss': ui.showNotice = false; break;
    case 'switch': toggle(id); break;
    case 'classless': ui.classless = !ui.classless; ui.status = `Classless ${ui.classless ? 'on' : 'off'}. Saved.`; announce(ui.status); break;
    // picking a filter opens the section(s) it shows
    case 'filter': ui.filter = v; if (FILTER_GROUPS[v]) FILTER_GROUPS[v].forEach((g) => ui.openGroups.add(g)); break;
    case 'lang': ui.lang = v; break;
    case 'group': if (ui.openGroups.has(v)) ui.openGroups.delete(v); else ui.openGroups.add(v); break;
    case 'detail': ui.detail = id; break;
    case 'detail-close': ui.detail = null; break;
    case 'report': alert('Opens the report form (ticket 07).'); return;
    default: return;
  }
  render();
});
document.addEventListener('input', (e) => {
  if (e.target.dataset.act !== 'query') return;
  ui.query = e.target.value; const pos = e.target.selectionStart; render();
  const q = document.querySelector('[data-act="query"]'); if (q) { q.focus(); q.setSelectionRange(pos, pos); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && ui.detail) { ui.detail = null; render(); } });
render();
})();
</script>
