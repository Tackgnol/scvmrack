<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Forge Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;1,400&family=Antonio:wght@400;700&family=Bebas+Neue&family=Caveat+Brush&family=MedievalSharp&display=swap">
<style>
/* PROTOTYPE — throwaway. Custom Class creator, variant B "Forge steps" (wayfinder ticket 04),
   polished with impeccable. Tokens mirror DESIGN.md. Single committed look: yellow paper, no dark theme. */
:root{
  --yellow:#FFE900; --pink:#FF3EB5; --black:#0a0a0a; --off-black:#111111; --grey:#1a1a1a;
  --dark-grey:#2a2a2a; --white:#f5f5f5; --muted:#888888; --blood:#8b0000;
  --agi:#2d5a27; --pre:#5a2754; --str:#5a3d27; --tou:#27455a;
  --f-display:'Caveat Brush','Bebas Neue',cursive; --f-head:'Bebas Neue','Arial Narrow',sans-serif;
  --f-gothic:'MedievalSharp',Georgia,serif; --f-label:'Antonio','Arial Narrow',sans-serif;
  --f-body:'Alegreya',Georgia,serif;
  --tap:44px;
  color-scheme: light;
}
*{box-sizing:border-box;border-radius:0}
html,body{background:var(--yellow)}
body{color:var(--black);font-family:var(--f-body);font-size:.9rem;line-height:1.5;padding-inline:16px;padding-block:0 48px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.04'/></svg>");
  scrollbar-color:var(--pink) var(--grey)}
::selection{background:var(--black);color:var(--yellow)}
.paper ::selection{background:var(--yellow);color:var(--black)}
button,input,select,textarea{font:inherit;color:inherit}
input,textarea{caret-color:var(--yellow)}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
/* On the yellow page a yellow ring disappears: ink it black there. */
.page-level :focus-visible,.b-step:focus-visible,.act.ink:focus-visible,.forged .btn:focus-visible{outline-color:var(--black)}
/* on black surfaces the ring stays yellow, including the snackbar that lives in a page-level wrapper */
.snackbar :focus-visible,.paper .btn:not(.forged .btn):focus-visible{outline:2px solid var(--yellow);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto}
.masthead{max-width:1180px;margin:0 auto;padding-block:16px 12px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between}
.masthead h1{font-family:var(--f-display);font-size:3rem;line-height:.85;margin:0;text-transform:uppercase;font-weight:400;color:var(--black)}
@media (max-width:600px){body{font-size:1rem}}
.masthead p{margin:0;color:var(--black);font-family:var(--f-label);font-size:.75rem;letter-spacing:.2em;text-transform:uppercase}
.stamp{display:inline-block;background:var(--yellow);color:var(--black);border:3px solid var(--black);box-shadow:4px 4px 0 var(--black);
  font-family:var(--f-head);font-size:1.5rem;line-height:1;padding:2px 10px;text-transform:uppercase;transform:rotate(-.4deg);margin:0;font-weight:400}
.stamp:focus{outline:none}
.paper{background:var(--black);color:var(--white);border:1px solid var(--grey);padding:20px}
.row{background:var(--off-black);border:1px solid var(--grey);padding:12px}
.label{font-family:var(--f-label);font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--pink);display:block;margin-bottom:4px}
.micro{font-family:var(--f-label);font-size:.68rem;letter-spacing:.15em;text-transform:uppercase}
.muted{color:var(--muted)}
.hint{font-family:var(--f-body);font-style:italic;color:var(--muted);margin:0;max-width:65ch}
input[type=text],input[type=number],select,textarea{background:var(--grey);border:2px solid var(--dark-grey);color:var(--white);padding:8px 10px;width:100%;min-height:var(--tap)}
input:hover,input:focus,select:hover,select:focus,textarea:hover,textarea:focus{border-color:var(--yellow);outline:none}
textarea{resize:vertical;min-height:72px;font-family:var(--f-body)}
input[type=number]{font-family:var(--f-head);font-size:1.2rem;text-align:center;font-variant-numeric:tabular-nums}
[aria-invalid="true"]{border-color:var(--pink)!important;border-style:dashed!important}
.field-error[hidden]{display:none}
.field-error{display:block;margin-top:4px;font-family:var(--f-label);font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--pink)}
.btn{font-family:var(--f-head);font-size:1.2rem;text-transform:uppercase;background:var(--pink);color:var(--black);border:2px solid var(--black);
  padding:8px 16px;min-height:var(--tap);cursor:pointer;box-shadow:3px 3px 0 var(--black);transition:transform .08s ease-out,box-shadow .08s ease-out;display:inline-flex;align-items:center;gap:8px}
.btn:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--black);background:var(--yellow)}
.btn:active{transform:none;box-shadow:none}
.btn.save{background:var(--yellow)} .btn.save:hover{background:var(--white)}
.btn.ink{background:var(--black);color:var(--yellow);border-color:var(--yellow)}
.btn.ink:hover{background:var(--black);color:var(--white)}
.btn[disabled]{background:transparent;color:var(--black);border-style:dashed;box-shadow:none;cursor:not-allowed;transform:none}
.btn svg{width:16px;height:16px;flex:none}
.act{font-family:var(--f-label);font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;background:transparent;color:var(--yellow);
  border:1px solid var(--yellow);padding:4px 12px;min-height:36px;cursor:pointer}
.act:hover{background:var(--yellow);color:var(--black)}
.act.on{background:var(--yellow);color:var(--black)}
.act[disabled],.act[disabled]:hover{background:transparent;color:var(--muted);border-color:var(--dark-grey);border-style:dashed;cursor:not-allowed}
.act.kill{border-color:var(--blood);color:var(--yellow);background:var(--blood)}
.act.kill:hover{background:var(--white);color:var(--blood);border-color:var(--white)}
.act.ink{color:var(--black);border-color:var(--black)}
.act.ink:hover,.act.ink.on{background:var(--black);color:var(--yellow)}
@media (pointer:coarse){.act{min-height:var(--tap)}}
.chip{display:inline-block;font-family:var(--f-label);font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;padding:3px 8px;background:var(--black);color:var(--yellow);border:1px solid var(--yellow);font-variant-numeric:tabular-nums}
.chip.agi{background:var(--agi);color:var(--white);border-color:var(--agi)} .chip.pre{background:var(--pre);color:var(--white);border-color:var(--pre)}
.chip.str{background:var(--str);color:var(--white);border-color:var(--str)} .chip.tou{background:var(--tou);color:var(--white);border-color:var(--tou)}
.chip.warn{background:var(--pink);color:var(--black);border-color:var(--pink)}
.chip.ok{background:transparent;color:var(--yellow);border-color:var(--dark-grey)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 18px;align-items:end}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:20px}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.dice{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:8px;align-items:end}
.dice label{min-width:0}
@media (max-width:520px){.dice{grid-template-columns:repeat(3,minmax(0,1fr))}.dice .check{grid-column:1/-1}}
.check{display:flex;gap:8px;align-items:center;font-family:var(--f-label);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--white);min-height:var(--tap);cursor:pointer}
.check input{accent-color:var(--pink);width:18px;height:18px;flex:none}
.counter{font-family:var(--f-label);font-size:.75rem;letter-spacing:.15em;color:var(--muted);font-variant-numeric:tabular-nums}
.counter.over{color:var(--pink)}
.empty{border:2px dashed var(--dark-grey);padding:16px;text-align:center;color:var(--muted);font-style:italic}
.itemhead{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.itemhead strong{font-family:var(--f-head);font-size:1.5rem;text-transform:uppercase;color:var(--yellow);font-weight:400;letter-spacing:.02em}
.typebadge{font-family:var(--f-label);font-size:.65rem;letter-spacing:.2em;background:var(--yellow);color:var(--black);padding:2px 6px;text-transform:uppercase}
.modrow{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-end;background:var(--black);border:2px solid var(--dark-grey);padding:12px}
.modrow .kill{margin-left:auto}
.statseg .act{min-width:56px;color:var(--white)}
.statseg .act:hover{color:var(--black)}
.statseg .act.on.str{background:var(--str);color:var(--white)} .statseg .act.on.agi{background:var(--agi);color:var(--white)}
.statseg .act.on.pre{background:var(--pre);color:var(--white)} .statseg .act.on.tou{background:var(--tou);color:var(--white)}
.seg{display:inline-flex;border:1px solid var(--yellow)}
.seg .act{border:0}
.seg .act + .act{border-left:1px solid var(--yellow)}

/* Flow shell */
.b-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@media (min-width:880px){.b-layout{grid-template-columns:250px minmax(0,1fr)}.b-railwrap{position:sticky;top:12px;align-self:start}}
.b-rail{display:flex;gap:8px;overflow-x:auto;padding:2px 6px 8px 2px;list-style:none;margin:0;scroll-snap-type:x proximity}
@media (min-width:880px){.b-rail{flex-direction:column;overflow:visible;padding:0}}
.b-rail li{flex:0 0 auto;scroll-snap-align:start}
.b-step{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:var(--black);color:var(--white);border:3px solid var(--grey);
  padding:8px 10px;min-height:var(--tap);cursor:pointer;text-align:left;min-width:180px;font-family:var(--f-gothic);font-size:1.2rem;
  box-shadow:2px 2px 0 var(--black);transition:transform .08s ease-out,box-shadow .08s ease-out}
.b-step:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--black);border-color:var(--white)}
.b-step[aria-current="step"]{border-color:var(--yellow);color:var(--yellow);box-shadow:4px 4px 0 var(--black);transform:rotate(-1deg)}
.b-step .n{font-family:var(--f-head);color:var(--muted);margin-right:6px;font-variant-numeric:tabular-nums}
.b-step[aria-current="step"] .n{color:var(--yellow)}
.rail-foot{margin-top:12px}
.b-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.b-nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.langsw{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.langsw .label{margin:0;color:var(--black)}
.langsw .act .miss{display:inline-block;margin-left:6px;background:var(--pink);color:var(--black);padding:0 5px}
.langsw .act.on .miss{background:var(--pink);color:var(--black)}

/* Review step */
.review{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@media (min-width:1040px){.review{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr)}}
.sheet{background:var(--black);color:var(--white);border:1px solid var(--grey);padding:16px}
.sheet h3{font-family:var(--f-gothic);color:var(--yellow);font-size:1.5rem;margin:0 0 4px;font-weight:400}
.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.statbox{background:var(--yellow);color:var(--black);text-align:center;padding:6px 2px}
.statbox b{display:block;font-family:var(--f-head);font-size:2rem;line-height:1;font-weight:400;font-variant-numeric:tabular-nums}
.statbox span{font-family:var(--f-label);font-size:.65rem;letter-spacing:.15em}
.res{display:flex;flex-wrap:wrap;gap:6px}
.res .chip{font-size:.72rem}
.chip.hp{background:var(--blood);color:var(--yellow);border-color:var(--blood)}
.small-title{font-family:var(--f-head);font-size:1.2rem;text-transform:uppercase;color:var(--yellow);margin:14px 0 4px;letter-spacing:.03em;font-weight:400}
.sheet ul{margin:0;padding-left:18px}
.pill{padding:1px 6px;background:var(--dark-grey);font-family:var(--f-label);font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;margin-left:6px}
.issues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.issues button{width:100%;text-align:left;background:var(--grey);color:var(--white);font-family:var(--f-label);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;
  padding:8px 10px;min-height:var(--tap);border:2px solid var(--black);cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
.issues button:hover{border-color:var(--yellow)}
.issues button span:last-child{white-space:nowrap;border:1px solid var(--yellow);color:var(--yellow);padding:2px 8px}
.issues button:hover span:last-child,.issues button:focus-visible span:last-child{background:var(--yellow);color:var(--black)}
.ready{background:var(--yellow);color:var(--black);border:2px solid var(--black);padding:10px 12px;font-family:var(--f-label);letter-spacing:.1em;text-transform:uppercase;font-size:.75rem}
.status{min-height:1.4em;font-family:var(--f-label);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase}
details.statebox{margin-top:28px}
details.statebox summary{cursor:pointer;font-family:var(--f-label);letter-spacing:.2em;font-size:.75rem;min-height:var(--tap);display:flex;align-items:center}
.state{background:var(--off-black);color:var(--white);font-family:monospace;font-size:.75rem;line-height:1.45;max-height:340px;overflow:auto;padding:12px;margin:0;white-space:pre-wrap;border:1px solid var(--grey)}

/* bolder: number controls speak the system's resource-stamp + counter vocabulary */
.stepper{display:flex;flex-direction:column;gap:4px;min-width:0}
.stepper-row{display:inline-flex;align-items:stretch}
.step-btn{width:44px;min-height:50px;background:transparent;border:2px solid var(--yellow);color:var(--yellow);cursor:pointer;display:grid;place-items:center;padding:0;transition:transform .08s ease-out,background .08s ease-out}
.step-btn svg{width:16px;height:16px}
.step-btn:hover{background:var(--yellow);color:var(--black)}
.step-btn:active{transform:translate(1px,1px)}
.step-btn[disabled]{border-style:dashed;border-color:var(--dark-grey);color:var(--dark-grey);background:transparent;cursor:not-allowed;transform:none}
input.stamp-num{width:64px;min-height:50px;padding:0;background:var(--yellow)!important;color:var(--black)!important;border:2px solid var(--yellow)!important;border-inline:0!important;
  font-family:var(--f-head);font-size:2rem;line-height:1;text-align:center;caret-color:var(--black);appearance:textfield;-moz-appearance:textfield}
input.stamp-num::-webkit-inner-spin-button,input.stamp-num::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input.stamp-num:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}
input.stamp-num[aria-invalid="true"]{background:var(--pink)!important;border-color:var(--pink)!important;border-style:solid!important}
.dicepick{display:flex;flex-wrap:wrap;gap:6px}
.die{min-width:50px;min-height:50px;padding:0 8px;background:transparent;color:var(--white);border:2px solid var(--dark-grey);font-family:var(--f-head);font-size:1.5rem;cursor:pointer;
  font-variant-numeric:tabular-nums;transition:transform .08s ease-out,border-color .08s ease-out}
.die:hover{border-color:var(--yellow);color:var(--yellow);transform:translate(-2px,-2px)}
.die[aria-checked="true"]{background:var(--yellow);color:var(--black);border-color:var(--yellow);transform:rotate(-1.5deg)}
.statline{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;background:var(--off-black);border:1px solid var(--grey);padding:14px}
@media (min-width:1080px){.statline{grid-template-columns:84px minmax(0,1fr) 230px;align-items:center}}
@media (max-width:520px){.die{min-width:44px;min-height:44px;font-size:1.2rem;padding:0 4px}.dicepick{gap:5px}}
.statname{font-family:var(--f-head);font-size:2rem;line-height:1;color:var(--white);padding:10px 8px;text-align:center;letter-spacing:.04em;justify-self:start;min-width:84px}
.statname.str{background:var(--str)} .statname.agi{background:var(--agi)} .statname.pre{background:var(--pre)} .statname.tou{background:var(--tou)}
.statctl{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-end}
.dropbtn{min-height:50px}
.result{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
@media (min-width:1080px){.result{align-items:flex-end;text-align:right}}
.formula{background:var(--yellow);color:var(--black);font-family:var(--f-head);font-size:2rem;line-height:1;padding:6px 12px 4px;transform:rotate(.6deg);white-space:nowrap;font-variant-numeric:tabular-nums}
.range{display:flex;flex-direction:column;gap:2px;white-space:nowrap;font-family:var(--f-label);font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.numgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px 20px;align-items:start}

/* polish: one control grammar for every Class Item */
.itemline{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:center;border-top:1px solid var(--grey);padding-top:14px}
@media (min-width:1000px){.itemline{grid-template-columns:minmax(0,1fr) 240px}}
.itemline .formula{font-size:1.5rem;white-space:normal;overflow-wrap:break-word;max-width:100%}
.itemline .result{align-items:flex-start}
@media (min-width:1000px){.itemline .result{align-items:flex-end;text-align:right}}
.choice .seg .act{min-height:50px;padding:4px 14px}
.choice .seg{flex-wrap:wrap;max-width:100%}
/* distill: abilities collapse to summary rows, one open at a time */
.abl-sum{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;background:var(--off-black);border:1px solid var(--grey);color:var(--white);
  padding:10px 12px;min-height:56px;text-align:left;cursor:pointer;transition:border-color .08s ease-out}
.abl-sum:hover{border-color:var(--yellow)}
.abl-name{font-family:var(--f-head);font-size:1.5rem;letter-spacing:.03em;text-transform:uppercase;color:var(--yellow);min-width:0;overflow-wrap:break-word;hyphens:manual}
.abl-chips{grid-column:2 / -1;display:flex;flex-wrap:wrap;gap:4px}
.abl-chips:empty{display:none}
.abl-edit{display:inline-flex;gap:6px;align-items:center;font-family:var(--f-label);font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.abl-edit svg{width:14px;height:14px}
.abl-sum:hover .abl-edit{color:var(--yellow)}
.kindtag{font-family:var(--f-label);font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;padding:3px 6px;border:1px solid var(--yellow);color:var(--yellow);white-space:nowrap}
.kindtag.fixed{background:var(--yellow);color:var(--black)}
.abl.open{border:2px solid var(--yellow)}
.extras{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card-foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
/* shape: Class Items <-> Abilities relationship */
.typebadge{font-size:.65rem}
.itemhead .typebadge{font-size:.75rem;padding:4px 8px;align-self:center}
.gate{display:flex;flex-direction:column;gap:14px;border:2px dashed var(--dark-grey);padding:20px}
.gate h3{margin:0;font-family:var(--f-head);font-size:2rem;font-weight:400;line-height:1;color:var(--yellow);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.gate p{margin:0;max-width:62ch}
.gate-no{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.gate-no p{margin:0;font-style:italic;color:var(--muted)}
.linkline{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:0;padding:8px 10px;background:var(--black);border:1px solid var(--dark-grey);font-family:var(--f-label);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase}
.linkline b{font-family:var(--f-head);font-size:1.2rem;font-weight:400;letter-spacing:.03em;color:var(--white)}
.linkline .odds{color:var(--yellow)}
.linkline.none{border-style:dashed;color:var(--muted)}
.linkline .act{margin-left:auto}
.linkline .aside{font-family:var(--f-body);font-style:italic;text-transform:none;letter-spacing:0;color:var(--muted);font-size:.9rem}
.tray{display:flex;flex-direction:column;gap:10px;background:var(--black);border:2px solid var(--yellow);padding:14px}
.tray ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tray li{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.tray li b{font-family:var(--f-head);font-size:1.5rem;font-weight:400;color:var(--yellow)}
.tray li .act{margin-left:auto}
.arrowhead{color:var(--muted);font-family:var(--f-label);font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;margin-left:6px}
.confirm{display:flex;flex-direction:column;gap:10px;background:var(--blood);color:var(--white);padding:12px;border:2px solid var(--black)}
.confirm p{margin:0;max-width:65ch}
.confirm .inline .act{border-color:var(--white);color:var(--white)}

/* ---------- validation (each issue knows where to fix it) ---------- */
function validate() {
  const issues = [];

    if (!String(obj[l] || '').trim()) issues.push({ msg: `${langLong[l]} missing: ${where}`, step: stepKey, lang: l, path: `${base}.${l}` });

    const n = it.name.en || it.name.pl || `Class Item ${i + 1}`;
    text(it.name, `items.${i}.name`, `Class Item “${n}” name`, 'items');
    if (!granterOf(keyOf(it))) issues.push({ msg: `Class Item “${n}” is not granted by any ability`, step: 'abilities', focusSel: `[data-act="grant-new"][data-v="${it.id}"]` });
  });
  state.abilities.forEach((a, i) => {
    const n = a.name.en || a.name.pl || `ability ${i + 1}`;
