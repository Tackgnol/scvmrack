<title>Class Forge Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;1,400&family=Antonio:wght@400;700&family=Bebas+Neue&family=Caveat+Brush&family=MedievalSharp&display=swap">
<style>
/* PROTOTYPE — throwaway. Custom Class creator, variant B "Forge steps" (wayfinder ticket 04),
   polished with impeccable. Tokens mirror DESIGN.md. Single committed look: yellow paper, no dark theme. */
:root{
  --yellow:#FFE900; --pink:#FF3EB5; --black:#0a0a0a; --off-black:#111111; --grey:#1a1a1a;
  --dark-grey:#2a2a2a; --white:#f5f5f5; --muted:#888888; --blood:#8b0000;
  --agi:#2d5a27; --pre:#5a2754; --str:#5a3d27; --tou:#27455a;
  --f-display:'Caveat Brush','Bebas Neue',cursive; --f-head:'Bebas Neue','Arial Narrow',sans-serif;
  --f-gothic:'MedievalSharp',Georgia,serif; --f-label:'Antonio','Arial Narrow',sans-serif;
  --f-body:'Alegreya',Georgia,serif;
  --tap:44px;
  color-scheme: light;
}
*{box-sizing:border-box;border-radius:0}
html,body{background:var(--yellow)}
body{color:var(--black);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 48px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.04'/></svg>");
  scrollbar-color:var(--pink) var(--grey)}
::selection{background:var(--black);color:var(--yellow)}
.paper ::selection{background:var(--yellow);color:var(--black)}
button,input,select,textarea{font:inherit;color:inherit}
input,textarea{caret-color:var(--yellow)}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
/* On the yellow page a yellow ring disappears: ink it black there. */
.page-level :focus-visible,.btn:focus-visible,.b-step:focus-visible,.act.ink:focus-visible{outline-color:var(--black)}
.wrap{max-width:1180px;margin:0 auto}
.masthead{max-width:1180px;margin:0 auto;padding-block:16px 12px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between}
.masthead h1{font-family:var(--f-display);font-size:clamp(2.2rem,6vw,3.2rem);line-height:.85;margin:0;text-transform:uppercase;font-weight:400}
.masthead p{margin:0;font-family:var(--f-label);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase}
.stamp{display:inline-block;background:var(--yellow);color:var(--black);border:3px solid var(--black);box-shadow:4px 4px 0 var(--black);
  font-family:var(--f-head);font-size:1.5rem;line-height:1;padding:2px 10px;text-transform:uppercase;transform:rotate(-.4deg);margin:0;font-weight:400}
.stamp:focus{outline:none}
.paper{background:var(--black);color:var(--white);border:1px solid var(--grey);padding:20px}
.row{background:var(--off-black);border:1px solid var(--grey);padding:12px}
.label{font-family:var(--f-label);font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--pink);display:block;margin-bottom:4px}
.micro{font-family:var(--f-label);font-size:.68rem;letter-spacing:.15em;text-transform:uppercase}
.muted{color:var(--muted)}
.hint{font-family:var(--f-body);font-style:italic;color:var(--muted);margin:0;max-width:65ch}
input[type=text],input[type=number],select,textarea{background:var(--grey);border:2px solid var(--dark-grey);color:var(--white);padding:8px 10px;width:100%;min-height:var(--tap)}
input:hover,input:focus,select:hover,select:focus,textarea:hover,textarea:focus{border-color:var(--yellow);outline:none}
textarea{resize:vertical;min-height:72px;font-family:var(--f-body)}
input[type=number]{font-family:var(--f-head);font-size:1.15rem;text-align:center;font-variant-numeric:tabular-nums}
[aria-invalid="true"]{border-color:var(--pink)!important;border-style:dashed!important}
.field-error[hidden]{display:none}
.field-error{display:block;margin-top:4px;font-family:var(--f-label);font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--pink)}
.btn{font-family:var(--f-head);font-size:1.15rem;text-transform:uppercase;background:var(--pink);color:var(--black);border:2px solid var(--black);
  padding:8px 16px;min-height:var(--tap);cursor:pointer;box-shadow:3px 3px 0 var(--black);transition:transform .08s ease-out,box-shadow .08s ease-out;display:inline-flex;align-items:center;gap:8px}
.btn:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--black);background:var(--yellow)}
.btn:active{transform:none;box-shadow:none}
.btn.save{background:var(--yellow)} .btn.save:hover{background:var(--white)}
.btn.ink{background:var(--black);color:var(--yellow);border-color:var(--yellow)}
.btn.ink:hover{background:var(--black);color:var(--white)}
.btn[disabled]{background:transparent;color:var(--black);border-style:dashed;box-shadow:none;cursor:not-allowed;transform:none}
.btn svg{width:16px;height:16px;flex:none}
.act{font-family:var(--f-label);font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;background:transparent;color:var(--yellow);
  border:1px solid var(--yellow);padding:4px 12px;min-height:36px;cursor:pointer}
.act:hover{background:var(--yellow);color:var(--black)}
.act.on{background:var(--yellow);color:var(--black)}
.act.kill{border-color:var(--blood);color:var(--white);background:var(--blood)}
.act.kill:hover{background:var(--white);color:var(--blood);border-color:var(--white)}
.act.ink{color:var(--black);border-color:var(--black)}
.act.ink:hover,.act.ink.on{background:var(--black);color:var(--yellow)}
@media (pointer:coarse){.act{min-height:var(--tap)}}
.chip{display:inline-block;font-family:var(--f-label);font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;padding:3px 8px;background:var(--black);color:var(--yellow);border:1px solid var(--yellow);font-variant-numeric:tabular-nums}
.chip.agi{background:var(--agi);color:var(--white);border-color:var(--agi)} .chip.pre{background:var(--pre);color:var(--white);border-color:var(--pre)}
.chip.str{background:var(--str);color:var(--white);border-color:var(--str)} .chip.tou{background:var(--tou);color:var(--white);border-color:var(--tou)}
.chip.warn{background:var(--pink);color:var(--black);border-color:var(--pink)}
.chip.ok{background:transparent;color:var(--yellow);border-color:var(--dark-grey)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 18px;align-items:end}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:20px}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.dice{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:8px;align-items:end}
.dice label{min-width:0}
@media (max-width:520px){.dice{grid-template-columns:repeat(3,minmax(0,1fr))}.dice .check{grid-column:1/-1}}
.check{display:flex;gap:8px;align-items:center;font-family:var(--f-label);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--white);min-height:var(--tap);cursor:pointer}
.check input{accent-color:var(--pink);width:18px;height:18px;flex:none}
.counter{font-family:var(--f-label);font-size:.7rem;letter-spacing:.15em;color:var(--muted);font-variant-numeric:tabular-nums}
.counter.over{color:var(--pink)}
.empty{border:2px dashed var(--dark-grey);padding:16px;text-align:center;color:var(--muted);font-style:italic}
.itemhead{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.itemhead strong{font-family:var(--f-head);font-size:1.5rem;text-transform:uppercase;color:var(--yellow);font-weight:400;letter-spacing:.02em}
.typebadge{font-family:var(--f-label);font-size:.62rem;letter-spacing:.2em;background:var(--yellow);color:var(--black);padding:2px 6px;text-transform:uppercase}
.modrow{display:grid;grid-template-columns:88px 76px minmax(0,1fr) auto;gap:8px;align-items:center}
@media (max-width:620px){.modrow{grid-template-columns:1fr 1fr auto}.modrow .scopes{grid-column:1/-1;grid-row:2}}
.scopes{display:flex;flex-wrap:wrap;gap:4px}
.seg{display:inline-flex;border:1px solid var(--yellow)}
.seg .act{border:0}
.seg .act + .act{border-left:1px solid var(--yellow)}

/* Flow shell */
.b-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@media (min-width:880px){.b-layout{grid-template-columns:250px minmax(0,1fr)}.b-railwrap{position:sticky;top:12px;align-self:start}}
.b-rail{display:flex;gap:8px;overflow-x:auto;padding:2px 6px 8px 2px;list-style:none;margin:0;scroll-snap-type:x proximity}
@media (min-width:880px){.b-rail{flex-direction:column;overflow:visible;padding:0}}
.b-rail li{flex:0 0 auto;scroll-snap-align:start}
.b-step{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:var(--black);color:var(--white);border:3px solid var(--grey);
  padding:8px 10px;min-height:var(--tap);cursor:pointer;text-align:left;min-width:180px;font-family:var(--f-gothic);font-size:1.2rem;
  box-shadow:2px 2px 0 var(--black);transition:transform .08s ease-out,box-shadow .08s ease-out}
.b-step:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--black);border-color:var(--white)}
.b-step[aria-current="step"]{border-color:var(--yellow);color:var(--yellow);box-shadow:4px 4px 0 var(--black);transform:rotate(-1deg)}
.b-step .n{font-family:var(--f-head);color:var(--muted);margin-right:6px;font-variant-numeric:tabular-nums}
.b-step[aria-current="step"] .n{color:var(--yellow)}
.rail-foot{margin-top:12px}
.b-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.b-nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.langsw{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.langsw .label{margin:0;color:var(--black)}
.langsw .act .miss{display:inline-block;margin-left:6px;background:var(--pink);color:var(--black);padding:0 5px}
.langsw .act.on .miss{background:var(--pink);color:var(--black)}

/* Review step */
.review{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@media (min-width:1040px){.review{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr)}}
.sheet{background:var(--black);color:var(--white);border:1px solid var(--grey);padding:16px}
.sheet h3{font-family:var(--f-gothic);color:var(--yellow);font-size:1.5rem;margin:0 0 4px;font-weight:400}
.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.statbox{background:var(--yellow);color:var(--black);text-align:center;padding:6px 2px}
.statbox b{display:block;font-family:var(--f-head);font-size:1.8rem;line-height:1;font-weight:400;font-variant-numeric:tabular-nums}
.statbox span{font-family:var(--f-label);font-size:.62rem;letter-spacing:.15em}
.res{display:flex;flex-wrap:wrap;gap:6px}
.res .chip{font-size:.72rem}
.chip.hp{background:var(--blood);color:var(--yellow);border-color:var(--blood)}
.small-title{font-family:var(--f-head);font-size:1.2rem;text-transform:uppercase;color:var(--yellow);margin:14px 0 4px;letter-spacing:.03em;font-weight:400}
.sheet ul{margin:0;padding-left:18px}
.pill{padding:1px 6px;background:var(--dark-grey);font-family:var(--f-label);font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;margin-left:6px}
.issues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.issues button{width:100%;text-align:left;background:var(--pink);color:var(--black);font-family:var(--f-label);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;
  padding:8px 10px;min-height:var(--tap);border:2px solid var(--black);cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
.issues button:hover{background:var(--white)}
.issues button span:last-child{white-space:nowrap;text-decoration:underline;text-underline-offset:3px}
.ready{background:var(--yellow);color:var(--black);border:2px solid var(--black);padding:10px 12px;font-family:var(--f-label);letter-spacing:.1em;text-transform:uppercase;font-size:.8rem}
.status{min-height:1.4em;font-family:var(--f-label);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase}
details.statebox{margin-top:28px}
details.statebox summary{cursor:pointer;font-family:var(--f-label);letter-spacing:.2em;text-transform:uppercase;font-size:.75rem;min-height:var(--tap);display:flex;align-items:center}
.state{background:var(--off-black);color:#c9f2c2;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.45;max-height:340px;overflow:auto;padding:12px;margin:0;white-space:pre-wrap;border:1px solid var(--grey)}

/* bolder: number controls speak the system's resource-stamp + counter vocabulary */
.stepper{display:flex;flex-direction:column;gap:4px;min-width:0}
.stepper-row{display:inline-flex;align-items:stretch}
.step-btn{width:44px;min-height:50px;background:transparent;border:2px solid var(--yellow);color:var(--yellow);cursor:pointer;display:grid;place-items:center;padding:0;transition:transform .08s ease-out,background .08s ease-out}
.step-btn svg{width:16px;height:16px}
.step-btn:hover{background:var(--yellow);color:var(--black)}
.step-btn:active{transform:translate(1px,1px)}
.step-btn[disabled]{border-style:dashed;border-color:var(--dark-grey);color:var(--dark-grey);background:transparent;cursor:not-allowed;transform:none}
input.stamp-num{width:64px;min-height:50px;padding:0;background:var(--yellow)!important;color:var(--black)!important;border:2px solid var(--yellow)!important;border-inline:0!important;
  font-family:var(--f-head);font-size:1.8rem;line-height:1;text-align:center;caret-color:var(--black);appearance:textfield;-moz-appearance:textfield}
input.stamp-num::-webkit-inner-spin-button,input.stamp-num::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input.stamp-num:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}
input.stamp-num[aria-invalid="true"]{background:var(--pink)!important;border-color:var(--pink)!important;border-style:solid!important}
.dicepick{display:flex;flex-wrap:wrap;gap:6px}
.die{min-width:50px;min-height:50px;padding:0 8px;background:transparent;color:var(--white);border:2px solid var(--dark-grey);font-family:var(--f-head);font-size:1.35rem;cursor:pointer;
  font-variant-numeric:tabular-nums;transition:transform .08s ease-out,border-color .08s ease-out}
.die:hover{border-color:var(--yellow);color:var(--yellow);transform:translate(-2px,-2px)}
.die[aria-checked="true"]{background:var(--yellow);color:var(--black);border-color:var(--yellow);transform:rotate(-1.5deg)}
.statline{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;background:var(--off-black);border:1px solid var(--grey);padding:14px}
@media (min-width:1080px){.statline{grid-template-columns:84px minmax(0,1fr) 230px;align-items:center}}
@media (max-width:520px){.die{min-width:44px;min-height:44px;font-size:1.2rem;padding:0 4px}.dicepick{gap:5px}}
.statname{font-family:var(--f-head);font-size:2rem;line-height:1;color:var(--white);padding:10px 8px;text-align:center;letter-spacing:.04em;justify-self:start;min-width:84px}
.statname.str{background:var(--str)} .statname.agi{background:var(--agi)} .statname.pre{background:var(--pre)} .statname.tou{background:var(--tou)}
.statctl{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-end}
.dropbtn{min-height:50px}
.result{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
@media (min-width:1080px){.result{align-items:flex-end;text-align:right}}
.formula{background:var(--yellow);color:var(--black);font-family:var(--f-head);font-size:clamp(1.8rem,4vw,2.3rem);line-height:1;padding:6px 12px 4px;transform:rotate(.6deg);white-space:nowrap;font-variant-numeric:tabular-nums}
.range{display:flex;flex-direction:column;gap:2px;white-space:nowrap;font-family:var(--f-label);font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.numgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px 20px;align-items:start}

/* polish: one control grammar for every Class Item */
.itemline{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:center;border-top:1px solid var(--grey);padding-top:14px}
@media (min-width:1000px){.itemline{grid-template-columns:minmax(0,1fr) 240px}}
.itemline .formula{font-size:1.5rem;white-space:normal;overflow-wrap:anywhere;max-width:100%}
.itemline .result{align-items:flex-start}
@media (min-width:1000px){.itemline .result{align-items:flex-end;text-align:right}}
.choice .seg .act{min-height:50px;padding:4px 14px}
.choice .seg{flex-wrap:wrap;max-width:100%}
/* distill: abilities collapse to summary rows, one open at a time */
.abl-sum{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;background:var(--off-black);border:1px solid var(--grey);color:var(--white);
  padding:10px 12px;min-height:56px;text-align:left;cursor:pointer;transition:border-color .08s ease-out}
.abl-sum:hover{border-color:var(--yellow)}
.abl-name{font-family:var(--f-head);font-size:1.5rem;letter-spacing:.03em;text-transform:uppercase;color:var(--yellow);min-width:0;overflow-wrap:anywhere}
.abl-chips{grid-column:2 / -1;display:flex;flex-wrap:wrap;gap:4px}
.abl-chips:empty{display:none}
.abl-edit{display:inline-flex;gap:6px;align-items:center;font-family:var(--f-label);font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.abl-edit svg{width:14px;height:14px}
.abl-sum:hover .abl-edit{color:var(--yellow)}
.kindtag{font-family:var(--f-label);font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;padding:3px 6px;border:1px solid var(--yellow);color:var(--yellow);white-space:nowrap}
.kindtag.fixed{background:var(--yellow);color:var(--black)}
.abl.open{border:2px solid var(--yellow)}
.extras{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card-foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
/* shape: Class Items <-> Abilities relationship */
.typebadge{font-size:.65rem}
.itemhead .typebadge{font-size:.75rem;padding:4px 8px;align-self:center}
.gate{display:flex;flex-direction:column;gap:14px;border:2px dashed var(--dark-grey);padding:20px}
.gate h3{margin:0;font-family:var(--f-head);font-size:2rem;font-weight:400;line-height:1;color:var(--yellow);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.gate p{margin:0;max-width:62ch}
.gate-no{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.gate-no p{margin:0;font-style:italic;color:var(--muted)}
.linkline{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:0;padding:8px 10px;background:var(--black);border:1px solid var(--dark-grey);font-family:var(--f-label);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase}
.linkline b{font-family:var(--f-head);font-size:1.2rem;font-weight:400;letter-spacing:.03em;color:var(--white)}
.linkline .odds{color:var(--yellow)}
.linkline.none{border-style:dashed;color:var(--muted)}
.linkline .act{margin-left:auto}
.tray{display:flex;flex-direction:column;gap:10px;background:var(--black);border:2px solid var(--yellow);padding:14px}
.tray ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tray li{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.tray li b{font-family:var(--f-head);font-size:1.5rem;font-weight:400;color:var(--yellow)}
.tray li .act{margin-left:auto}
.arrowhead{color:var(--muted);font-family:var(--f-label);font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;margin-left:6px}
.confirm{display:flex;flex-direction:column;gap:10px;background:var(--blood);color:var(--white);padding:12px;border:2px solid var(--black)}
.confirm p{margin:0;max-width:65ch}
.confirm .inline .act{border-color:var(--white);color:var(--white)}
.confirm .inline .act:hover{background:var(--white);color:var(--blood)}
.confirm .inline .act.danger{background:var(--white);color:var(--blood)}
.rowlink{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,200px);gap:4px 8px;align-items:start}
.rowlink > span{font-family:var(--f-head);font-size:1.2rem;color:var(--yellow);text-align:center;padding-top:10px}
@media (max-width:620px){.rowlink{grid-template-columns:34px minmax(0,1fr)}.rowlink select{grid-column:2}}
.snackbar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;display:flex;gap:14px;align-items:center;
  max-width:calc(100vw - 32px);background:var(--black);color:var(--white);border:2px solid var(--yellow);box-shadow:4px 4px 0 var(--black);padding:8px 8px 8px 14px;
  font-family:var(--f-label);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase}
.snackbar .btn{min-height:40px;padding:4px 12px;font-size:1.2rem;flex:none}
.snackbar span{flex:1;min-width:0}

/* animate: hard cuts and physical motion only (no opacity), per the MÖRK BORG world */
@keyframes stamp-press{from{transform:scale(1.18) rotate(-3deg)}to{transform:none}}
@keyframes snack-in{from{translate:0 14px}to{translate:0 0}}
@keyframes reveal-down{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
::view-transition-group(*){animation-duration:320ms;animation-timing-function:cubic-bezier(0.16,1,0.3,1)}
html[data-vt="close"]::view-transition-group(*){animation-duration:220ms}
::view-transition-image-pair(*){overflow:clip}
/* no cross-fades: the old image disappears at once, the new one is fully there from frame one */
::view-transition-old(*){animation:none;display:none}
::view-transition-new(*){animation:none;height:100%;object-fit:none;object-position:top}
html[data-vt="step"]::view-transition-new(step-stamp){animation:stamp-press 260ms cubic-bezier(0.16,1,0.3,1) both}
html[data-vt="step"]::view-transition-group(step-stamp){animation:none}

.snackbar{animation:snack-in 180ms cubic-bezier(0.16,1,0.3,1)}
.confirm{animation:reveal-down 200ms cubic-bezier(0.16,1,0.3,1)}

  ::view-transition-group(*),::view-transition-new(*){animation:none!important}
  .snackbar,.confirm{animation:none}
}

.row .linkline{background:var(--black)}
article.row > .itemhead{margin:-12px -12px 4px;padding:12px;border-bottom:2px solid var(--dark-grey)}
.stack > article.row + article.row,.stack > .abl + .abl,.stack > .statline + .statline{margin-top:8px}

/* polish: four-level title hierarchy on DESIGN.md's ramp */
#step-title{font-size:2rem;padding:4px 12px 2px}
.label.group{font-family:var(--f-head);font-size:1.2rem;letter-spacing:.04em;color:var(--white);margin-bottom:6px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}.b-step[aria-current="step"],.stamp{transform:none!important}}

<header class="masthead">
  <h1>Forge a class</h1>
  <p>Prototype · nothing is saved</p>
</header>
<main class="wrap" id="root"></main>

<script>
(() => {
const LIMIT_LIST = 20, LIMIT_TEXT = 1500;
const STATS = [
  { key: 'strength', short: 'STR', cls: 'str' },
  { key: 'agility', short: 'AGI', cls: 'agi' },
  { key: 'presence', short: 'PRE', cls: 'pre' },
  { key: 'toughness', short: 'TOU', cls: 'tou' },
];
const SCOPES = [
  { key: 'all', label: 'All' }, { key: 'combat', label: 'Combat' }, { key: 'defence', label: 'Defence' },
  { key: 'melee', label: 'Melee' }, { key: 'ranged', label: 'Ranged' }, { key: 'powers', label: 'Powers' }, { key: 'tests', label: 'Tests' },
];
const CATALOG = [
  { key: 'weapons.brown-scimitar', label: 'The Brown Scimitar of Galgenbeck' },
  { key: 'equipment.lockpicks', label: 'Lockpicks' },
  { key: 'pets.hawk', label: 'Hawk' },
];
const STEPS = [
  { key: 'identity', label: 'Identity', hint: 'What the class is called and how a player first meets it.' },
  { key: 'numbers', label: 'Stats & dice', hint: 'How each stat is rolled, plus HP, omens, silver and starting gear dice.' },
  { key: 'items', label: 'Class Items', hint: 'Weapons, armor, gear and pets only this class has. Each one reaches a scvm through one ability, which you pick in the next step. They never appear in item search.' },
  { key: 'abilities', label: 'Abilities', hint: 'Fixed abilities every scvm gets, and the pool random ones are rolled from. Abilities are how a scvm gets this class’s Class Items.' },
  { key: 'origins', label: 'Origins', hint: 'Where this wretch came from. One is picked at random for each scvm.' },
  { key: 'gb', label: 'Getting Better', hint: 'What happens when a scvm of this class gets better.' },
  { key: 'review', label: 'Test roll & save', hint: 'Roll a scvm from the draft as it stands, then save the class.' },
];
const ARROW_L = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"/></svg>';
const MINUS = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10" stroke="currentColor" stroke-width="2.6" stroke-linecap="square"/></svg>';
const PLUS = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M8 3v10" stroke="currentColor" stroke-width="2.6" stroke-linecap="square"/></svg>';
const ARROW_R = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"/></svg>';
const DIE = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"/><rect x="4.5" y="4.5" width="2" height="2" fill="currentColor"/><rect x="9.5" y="9.5" width="2" height="2" fill="currentColor"/><rect x="7" y="7" width="2" height="2" fill="currentColor"/></svg>';

let uid = 100;
const L = (en, pl) => ({ en, pl });
const row = (en, pl, item = '') => ({ en, pl, item });
const state = {
  name: L('Pale Ossuary Keeper', 'Blady Strażnik Kostnicy'),
  description: L('You swept the bone-halls of Galgenbeck until the dead started answering back. Now you carry what they told you.',
                 'Zamiatałeś kostnice Galgenbecku, aż umarli zaczęli odpowiadać. Teraz niesiesz to, co ci powiedzieli.'),
  languages: ['en', 'pl'],
  stats: {
    strength: { count: 3, faces: 6, mod: -1, dropLowest: false },
    agility: { count: 3, faces: 6, mod: 0, dropLowest: false },
    presence: { count: 4, faces: 6, mod: 0, dropLowest: true },
    toughness: { count: 3, faces: 6, mod: 1, dropLowest: false },
  },
  hpDie: 6, omenDie: 4, weaponDie: 8, armorDie: 2,
  silver: { count: 2, faces: 6, mult: 10 },
  randomCount: 1,
  items: [
    { id: 11, type: 'weapon', name: L('Reliquary Flail', 'Cep Relikwiarzowy'), diceCount: 1, diceFaces: 6, dmgMod: 0, reach: 'melee', value: 0,
      description: L('Roll d6 when you hit. On a 1 the chain wraps your own arm: 1 damage to you. On a 6 a saint wakes and the target is stunned.',
                     'Rzuć k6 po trafieniu. Na 1 łańcuch owija się wokół twojej ręki: 1 obrażenie dla ciebie. Na 6 budzi się święty i cel jest ogłuszony.') },
    { id: 12, type: 'pet', name: L('Carrion Crow', 'Padlinożerna Wrona'), hp: 3, actionDie: 4, actionType: 'attack', humanoid: false, value: 0, description: L('Pecks at eyes. Remembers who wronged you.', 'Dziobie w oczy. Pamięta, kto cię skrzywdził.') },
    { id: 13, type: 'equipment', name: L('Grave-Salt Pouch', 'Sakiewka Grobowej Soli'), kind: 'consumable', uses: 3, value: 0, description: L('', '') },
  ],
  abilities: [
    { id: 1, random: false, name: L('Bone-Reader', 'Czytacz Kości'),
      text: L('Once per day ask a skull one question. It answers truthfully, if unkindly.', 'Raz dziennie zadaj czaszce jedno pytanie. Odpowie szczerze, choć nieuprzejmie.'),
      grantItem: '', grantPet: '', mods: [], table: null },
    { id: 2, random: true, name: L('Reliquary Flail', 'Cep Relikwiarzowy'),
      text: L('A chain of saints\' knuckles on a femur haft.', 'Łańcuch z kostek świętych na trzonku z kości udowej.'),
      grantItem: 'ci:11', grantPet: '', mods: [], table: null },
    { id: 3, random: true, name: L('Carrion Crow', 'Padlinożerna Wrona'),
      text: L('It follows you. It remembers faces.', 'Podąża za tobą. Pamięta twarze.'),
      grantItem: '', grantPet: 'ci:12', mods: [], table: null },
    { id: 4, random: true, name: L('Grave Sense', ''),
      text: L('You smell the recently dead through walls. +2 on Presence tests to find them.', ''),
      grantItem: '', grantPet: '', mods: [{ stat: 'presence', value: 2, scope: 'tests' }], table: null },
    { id: 5, random: true, name: L('Litany of Bones', 'Litania Kości'),
      text: L('Carry d6 bone charms. Before a fight, roll on the table.', 'Nosisz k6 kościanych amuletów. Przed walką rzuć na tabelę.'),
      grantItem: '', grantPet: '', mods: [],
      table: { die: 4, rows: [row('The charm cracks. Nothing.', 'Amulet pęka. Nic.'), row('+1 armor tier this fight.', '+1 poziom pancerza w tej walce.'), row('One enemy flees in terror.', 'Jeden wróg ucieka w przerażeniu.'), row('Test Presence DR12 or lose d4 HP.', 'Test Prezencji ST12 albo tracisz k4 PW.')] } },
  ],
  origins: [
    L('The ossuary of the Shunned Chapel', 'Kostnica Wyklętej Kaplicy'),
    L('A plague pit outside Grift', 'Dół zarazy pod Griftem'),
    L('The catacombs under Schleswig', ''),
  ],
  gettingBetter: 'extra-ability',
  gbNote: L('', ''),
};
// UI-only state (never saved): the Class Items question and in-card confirmations.
const ui = { itemsNo: false, itemsYes: false, confirm: null, snack: null, openAbility: null, showGrants: new Set(), forgeFor: null };

/* ---------- helpers ---------- */
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const getPath = (p) => p.split('.').reduce((o, k) => (o == null ? o : o[k]), state);
function setPath(p, v) {
  const ks = p.split('.'); let o = state;
  for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]];
  o[ks.at(-1)] = v;
}
const fid = (p) => `f-${p.replace(/\./g, '-')}`;
const langLong = { en: 'English', pl: 'Polish' };
let step = 0;
let viewLang = 'en';
let lastRoll = null;
let saveMsg = '';
const tx = (o) => (o ? o[viewLang] || o[state.languages[0]] || o.en || o.pl || '' : '');
const optional = (path) => path.startsWith('gbNote') || /^items\.\d+\.description\./.test(path);
const keyOf = (it) => `ci:${it.id}`;
const itemByKey = (k) => state.items.find((it) => keyOf(it) === k);
const poolSize = () => state.abilities.filter((a) => a.random).length;
const typeWord = { weapon: 'weapon', armor: 'armor', equipment: 'gear', pet: 'pet' };

/* One granter per Class Item: an ability's item/pet slot, or one reference-table row. */
function granterOf(k) {
  for (let i = 0; i < state.abilities.length; i++) {
    const a = state.abilities[i];
    if (a.grantItem === k) return { kind: 'ability', i, a, slot: 'grantItem' };
    if (a.grantPet === k) return { kind: 'ability', i, a, slot: 'grantPet' };
    if (a.table) { const r = a.table.rows.findIndex((x) => x.item === k); if (r >= 0) return { kind: 'table', i, a, row: r }; }
  }
  return null;
}
const odds = (a) => (a.random ? `if rolled · ${state.randomCount} of ${poolSize()}` : 'every scvm');
function itemStats(it) {
  if (it.type === 'weapon') return `${it.diceCount}d${it.diceFaces}${it.dmgMod ? ` ${it.dmgMod > 0 ? '+' : '−'}${Math.abs(it.dmgMod)}` : ''} · ${it.reach}`;
  if (it.type === 'pet') return `${it.hp} HP · d${it.actionDie} ${it.actionType === 'buff' ? 'buff' : 'attack'}${it.humanoid ? ' · humanoid' : ''}`;
  if (it.type === 'armor') return `armor tier ${it.tier}`;
  return `${it.kind}${it.uses ? ` · ${it.uses} uses` : ''}`;
}
function itemLabel(key) {
  if (!key) return '';
  if (key.startsWith('ci:')) { const it = itemByKey(key); return it ? tx(it.name) || 'Unnamed Class Item' : ''; }
  return (CATALOG.find((c) => c.key === key) || { label: key }).label;
}
function textInput(path, { multiline = false, lang, label = '' } = {}) {
  const v = getPath(path) ?? '';
  const miss = !optional(path) && state.languages.includes(lang) && !String(v).trim();
  const id = fid(path);
  const attrs = `id="${id}" data-path="${path}" maxlength="${LIMIT_TEXT}" aria-invalid="${miss}" ${miss ? `aria-describedby="${id}-err"` : ''} ${label ? `aria-label="${esc(label)}"` : ''}`;
  const input = multiline ? `<textarea ${attrs}>${esc(v)}</textarea>` : `<input type="text" ${attrs} value="${esc(v)}">`;
  return `${input}<span class="field-error" id="${id}-err" ${miss ? '' : 'hidden'}>${langLong[lang]} text missing</span>`;
}
function lfield(base, label, { multiline = false } = {}) {
  const path = `${base}.${viewLang}`;
  return `<div><label class="label" for="${fid(path)}">${esc(label)}</label>${textInput(path, { multiline, lang: viewLang })}</div>`;
}
function num(path, label, { min = 0, max = 99, invalid = false } = {}) {
  const v = Number(getPath(path)) || 0;
  const id = fid(path);
  return `<div class="stepper"><label class="label" for="${id}">${esc(label)}</label><div class="stepper-row">
    <button type="button" class="step-btn" data-act="nudge" data-path="${path}" data-d="-1" aria-label="Decrease ${esc(label)}" ${v <= min ? 'disabled' : ''}>${MINUS}</button>
    <input type="number" class="stamp-num" id="${id}" data-path="${path}" data-num="1" min="${min}" max="${max}" value="${v}" inputmode="numeric" aria-invalid="${invalid}">
    <button type="button" class="step-btn" data-act="nudge" data-path="${path}" data-d="1" aria-label="Increase ${esc(label)}" ${v >= max ? 'disabled' : ''}>${PLUS}</button>
  </div></div>`;
}
function dieSelect(path, label, dice, fmt = (x) => `d${x}`) {
  const v = getPath(path);
  const lid = `${fid(path)}-label`;
  return `<div class="stepper"><span class="label" id="${lid}">${esc(label)}</span><div class="dicepick" role="radiogroup" aria-labelledby="${lid}">${dice.map((d) =>
    `<button type="button" class="die" role="radio" aria-checked="${d === v}" tabindex="${d === v ? 0 : -1}" data-act="pick" data-path="${path}" data-v="${d}">${fmt(d)}</button>`).join('')}</div></div>`;
}
function counter(n, label) {
  return `<span class="counter ${n > LIMIT_LIST ? 'over' : ''}">${n} of ${LIMIT_LIST} ${label}</span>`;
}
function announce(msg) { const el = document.getElementById('announce'); if (el) { el.textContent = ''; setTimeout(() => { el.textContent = msg; }, 30); } }

/* ---------- validation (each issue knows where to fix it) ---------- */
function validate() {
  const issues = [];
  const text = (obj, base, where, stepKey) => state.languages.forEach((l) => {
    if (!String(obj[l] || '').trim()) issues.push({ msg: `${langLong[l]} missing: ${where}`, step: stepKey, lang: l, path: `${base}.${l}` });
  });
  text(state.name, 'name', 'class name', 'identity');
  text(state.description, 'description', 'class description', 'identity');
  state.items.forEach((it, i) => {
    const n = it.name.en || it.name.pl || `Class Item ${i + 1}`;
    text(it.name, `items.${i}.name`, `Class Item “${n}” name`, 'items');
    if (!granterOf(keyOf(it))) issues.push({ msg: `Class Item “${n}” is not granted by any ability`, step: 'abilities', focusSel: `[data-act="grant-new"][data-v="${it.id}"]` });
  });
  state.abilities.forEach((a, i) => {
    const n = a.name.en || a.name.pl || `ability ${i + 1}`;
    text(a.name, `abilities.${i}.name`, `ability “${n}” name`, 'abilities');
    text(a.text, `abilities.${i}.text`, `ability “${n}” rules text`, 'abilities');
    if (a.table) a.table.rows.forEach((r, k) => text(r, `abilities.${i}.table.rows.${k}`, `ability “${n}” table row ${k + 1}`, 'abilities'));
  });
  state.origins.forEach((o, k) => text(o, `origins.${k}`, `origin ${k + 1}`, 'origins'));
  if (state.randomCount > poolSize()) issues.push({ msg: `Rolls ${state.randomCount} random abilities, but the pool has ${poolSize()}`, step: 'abilities', path: 'randomCount' });
  if (state.abilities.length > LIMIT_LIST) issues.push({ msg: `More than ${LIMIT_LIST} abilities`, step: 'abilities' });
  if (state.items.length > LIMIT_LIST) issues.push({ msg: `More than ${LIMIT_LIST} Class Items`, step: 'items' });
  if (state.origins.length > LIMIT_LIST) issues.push({ msg: `More than ${LIMIT_LIST} origins`, step: 'origins' });
  if (state.origins.length === 0) issues.push({ msg: 'Add at least one origin', step: 'origins' });
  return issues;
}
const countFor = (issues, key) => issues.filter((x) => x.step === key).length;
const missingIn = (issues, lang, stepKey) => issues.filter((x) => x.lang === lang && (!stepKey || x.step === stepKey)).length;

/* ---------- test roll ---------- */
const d = (n) => 1 + Math.floor(Math.random() * n);
function rollSpec(s) {
  const rolls = Array.from({ length: s.count }, () => d(s.faces)).sort((a, b) => a - b);
  const kept = s.dropLowest && rolls.length > 1 ? rolls.slice(1) : rolls;
  return { total: kept.reduce((a, b) => a + b, 0) + (s.mod || 0) };
}
const scoreMod = (x) => (x <= 4 ? -3 : x <= 6 ? -2 : x <= 8 ? -1 : x <= 12 ? 0 : x <= 14 ? 1 : x <= 16 ? 2 : 3);
const signed = (n) => (n > 0 ? `+${n}` : n < 0 ? `−${Math.abs(n)}` : '0');
const sameName = (a, it) => it && tx(a.name).trim().toLowerCase() === tx(it.name).trim().toLowerCase();
function testRoll() {
  const stats = {};
  STATS.forEach((s) => { const r = rollSpec(state.stats[s.key]); stats[s.key] = { ...r, mod: scoreMod(r.total) }; });
  const hp = Math.max(1, d(state.hpDie) + stats.toughness.mod);
  const silver = Array.from({ length: state.silver.count }, () => d(state.silver.faces)).reduce((a, b) => a + b, 0) * state.silver.mult;
  const fixed = state.abilities.filter((a) => !a.random);
  const pool = [...state.abilities.filter((a) => a.random)].sort(() => Math.random() - 0.5).slice(0, state.randomCount);
  const origin = state.origins.length ? state.origins[d(state.origins.length) - 1] : null;
  lastRoll = { stats, hp, omens: d(state.omenDie), silver, weapon: d(state.weaponDie), armor: d(state.armorDie), abil: [...fixed, ...pool], origin };
}
function rollSheet() {
  if (!lastRoll) return `<div class="sheet"><p class="hint" style="margin:0">No test roll yet. A test roll uses the draft exactly as it is and keeps nothing.</p></div>`;
  const r = lastRoll;
  const lines = [], gear = [];
  r.abil.forEach((a) => {
    const granted = [a.grantItem, a.grantPet].filter(Boolean);
    const merged = granted.map(itemByKey).find((it) => sameName(a, it));
    lines.push(`<li><b>${esc(tx(a.name))}</b>${a.random ? '<span class="pill">rolled</span>' : ''}${merged ? ` <span class="muted">· ${typeWord[merged.type]} ${esc(itemStats(merged))}</span>` : ''}</li>`);
    granted.forEach((k) => { const it = itemByKey(k); if (!(it && it === merged)) gear.push(itemLabel(k)); });
  });
  return `<div class="sheet" aria-live="polite">
    <span class="micro muted">Test scvm · ${esc(tx(state.name))}</span>
    <h3>Nameless Wretch</h3>
    <div class="statrow">${STATS.map((s) => `<div class="statbox"><b>${signed(r.stats[s.key].mod)}</b><span>${s.short} ${r.stats[s.key].total}</span></div>`).join('')}</div>
    <div class="res"><span class="chip hp">HP ${r.hp}</span><span class="chip">Omens ${r.omens}</span><span class="chip">${r.silver} silver</span><span class="chip">Weapon d${state.weaponDie}: ${r.weapon}</span><span class="chip">Armor d${state.armorDie}: ${r.armor}</span></div>
    <div class="small-title">Abilities</div>
    <ul>${lines.join('') || '<li class="muted">None</li>'}</ul>
    ${gear.length ? `<div class="small-title">Also starts with</div><ul>${gear.map((g) => `<li>${esc(g)}</li>`).join('')}</ul>` : ''}
    <div class="small-title">Origin</div><p style="margin:0">${esc(tx(r.origin)) || '<span class="muted">None</span>'}</p>
  </div>`;
}

/* ---------- step bodies ---------- */
function langClassBlock() {
  const dual = state.languages.length > 1;
  return `<div class="row stack" role="group" aria-labelledby="langs-label"><span class="label group" id="langs-label" style="margin:0">Languages this class is written in</span>
    <div class="seg" role="group" aria-label="Class languages">
      <button type="button" class="act ${!dual && state.languages[0] === 'en' ? 'on' : ''}" aria-pressed="${!dual && state.languages[0] === 'en'}" data-act="set-langs" data-v="en">English only</button>
      <button type="button" class="act ${!dual && state.languages[0] === 'pl' ? 'on' : ''}" aria-pressed="${!dual && state.languages[0] === 'pl'}" data-act="set-langs" data-v="pl">Polish only</button>
      <button type="button" class="act ${dual ? 'on' : ''}" aria-pressed="${dual}" data-act="set-langs" data-v="both">Both</button>
    </div>
    <p class="hint">${dual ? 'Every text field needs both languages. Players see their own.' : `Players in either language see the ${langLong[state.languages[0]]} text.`}</p></div>`;
}
function statRange(st) {
  const kept = st.dropLowest && st.count > 1 ? st.count - 1 : st.count;
  const lo = kept + (st.mod || 0), hi = kept * st.faces + (st.mod || 0);
  return `<span>score ${lo}–${hi}</span><span>mod ${signed(scoreMod(lo))} to ${signed(scoreMod(hi))}</span>`;
}
function formulaText(st) {
  const mod = st.mod ? ` ${st.mod > 0 ? '+' : '−'}${Math.abs(st.mod)}` : '';
  return st.dropLowest && st.count > 1 ? `best ${st.count - 1} of ${st.count}d${st.faces}${mod}` : `${st.count}d${st.faces}${mod}`;
}
function statsBody() {
  return `<div class="stack">
    ${STATS.map((s) => {
      const p = `stats.${s.key}`, st = state.stats[s.key];
      return `<section class="statline" aria-label="${s.short} dice">
        <div class="statname ${s.cls}" aria-hidden="true">${s.short}</div>
        <div class="statctl">
          ${num(`${p}.count`, 'Dice', { min: 1, max: 6 })}
          ${dieSelect(`${p}.faces`, 'Sides', [4, 6, 8, 10, 12])}

        </div>

    }).join('')}
    <div class="row numgrid">${dieSelect('hpDie', 'HP die (+ TOU)', [2, 4, 6, 8, 10, 12])}${dieSelect('omenDie', 'Omen die', [2, 4, 6])}${dieSelect('weaponDie', 'Starting weapon die', [4, 6, 8, 10])}${dieSelect('armorDie', 'Starting armor die', [2, 3, 4])}</div>
    <div class="row numgrid">${num('silver.count', 'Silver dice', { min: 1, max: 6 })}${dieSelect('silver.faces', 'Silver sides', [4, 6])}${num('silver.mult', 'Silver multiplier', { min: 1, max: 100 })}</div>
  </div>`;
}

/* Class Items: the question first, then the items, each saying who grants it. */
function choice(path, label, options) {
  const v = getPath(path);
  const lid = `${fid(path)}-label`;
  return `<div class="stepper choice"><span class="label" id="${lid}">${esc(label)}</span><div class="seg" role="radiogroup" aria-labelledby="${lid}">${options.map(([val, text]) =>
    `<button type="button" class="act ${String(v) === String(val) ? 'on' : ''}" role="radio" aria-checked="${String(v) === String(val)}" data-act="choose" data-path="${path}" data-v="${val}">${esc(text)}</button>`).join('')}</div></div>`;
}
function itemLine(it, i, controls) {
  return `<div class="itemline"><div class="statctl">${controls}</div>
    <div class="result"><div class="formula" data-derived="item-${it.id}">${esc(itemStats(it))}</div></div></div>`;
}
function itemFields(it, i) {
  const p = `items.${i}`;

    `${num(`${p}.diceCount`, 'Damage dice', { min: 1, max: 6 })}${dieSelect(`${p}.diceFaces`, 'Sides', [2, 4, 6, 8, 10, 12])}${num(`${p}.dmgMod`, 'Modifier', { min: -6, max: 6 })}${choice(`${p}.reach`, 'Reach', [['melee', 'Melee'], ['ranged', 'Ranged']])}${value}`)
    + '';
  if (it.type === 'pet') return itemLine(it, i,
    `${num(`${p}.hp`, 'HP', { min: 1, max: 99 })}${dieSelect(`${p}.actionDie`, 'Action die', [2, 4, 6, 8, 10])}${choice(`${p}.actionType`, 'Action', [['attack', 'Attacks'], ['buff', 'Buffs allies']])}${choice(`${p}.humanoid`, 'Kind', [['false', 'Beast'], ['true', 'Humanoid']])}`);
  if (it.type === 'armor') return itemLine(it, i, `${dieSelect(`${p}.tier`, 'Armor tier', [1, 2, 3], (x) => `Tier ${x}`)}${value}`);
  return itemLine(it, i, `${choice(`${p}.kind`, 'Kind', [['consumable', 'Consumable'], ['wearable', 'Wearable'], ['gear', 'Gear']])}${num(`${p}.uses`, 'Uses', { min: 0, max: 99 })}${value}`);
}

  return `<p class="linkline"><span>Granted by</span><b>${esc(tx(g.a.name) || 'Unnamed ability')}</b><span>·</span>${where}<button type="button" class="act" data-act="goto-granter" data-v="${it.id}">Go to ability</button></p>`;
}
function itemConfirm(it) {
  const g = granterOf(keyOf(it));
  const who = g ? `${g.kind === 'table' ? 'a table row in ' : ''}the ability “${esc(tx(g.a.name) || 'Unnamed')}”` : '';
  return `<div class="confirm" role="group" aria-label="Confirm removal"><p>“${esc(tx(it.name) || 'This item')}” is granted by ${who}. Remove the item and clear that grant?</p>
    <div class="inline"><button type="button" class="act danger" data-act="rm-item-yes" data-v="${it.id}">Remove and clear</button><button type="button" class="act" data-act="confirm-cancel" data-v="item-${it.id}">Keep it</button></div></div>`;
}
function addItemRow(full) {
  return `<div class="inline"><span class="label group" style="margin:0">Forge a</span>${['weapon', 'armor', 'equipment', 'pet'].map((t) => `<button type="button" class="act" data-act="add-item" data-v="${t}" ${full ? 'disabled' : ''}>${typeWord[t]}</button>`).join('')}</div>`;
}
function itemsBody() {
  if (!state.items.length && ui.itemsNo) return `<div class="gate-no"><p>No Class Items. Abilities can still grant gear from the shared catalog.</p><button type="button" class="act" data-act="gate-change">Change</button></div>`;
  if (!state.items.length && !ui.itemsYes) return `<div class="gate">
      <h3>Does this class carry its own gear or beasts?</h3>
      <p>Class Items are weapons, armor, gear or pets only this class has, like the Fanged Deserter's Brown Scimitar or an Ancient Gore-Hound. Each one reaches a scvm through one ability.</p>
      <div class="inline"><button type="button" class="btn save" data-act="gate-yes">Yes, forge a Class Item</button><button type="button" class="btn ink" data-act="gate-no">No, only catalog gear</button></div>
    </div>`;
  const full = state.items.length >= LIMIT_LIST;
  return `<div class="stack">
    <div class="spread">${addItemRow(full)}${counter(state.items.length, 'Class Items')}</div>
    ${state.items.map((it, i) => `<article class="row stack" aria-label="${esc(tx(it.name) || 'Unnamed Class Item')}" data-item="${it.id}">
      <div class="itemhead"><div class="inline"><span class="typebadge">${typeWord[it.type]}</span><strong>${esc(tx(it.name) || 'Unnamed')}</strong></div>
        ${ui.confirm && ui.confirm.type === 'item' && ui.confirm.id === it.id ? '' : `<button type="button" class="act kill" data-act="rm-item" data-v="${it.id}">Remove</button>`}</div>
      ${ui.confirm && ui.confirm.type === 'item' && ui.confirm.id === it.id ? itemConfirm(it) : ''}
      ${grantedByLine(it)}
      ${lfield(`items.${i}.name`, 'Name')}${lfield(`items.${i}.description`, 'Description (optional): special rules, effects, flavour', { multiline: true })}
      <div class="stepper choice"><span class="label" id="type-${it.id}">Type</span><div class="seg" role="radiogroup" aria-labelledby="type-${it.id}">${['weapon', 'armor', 'equipment', 'pet'].map((t) => `<button type="button" class="act ${it.type === t ? 'on' : ''}" role="radio" aria-checked="${it.type === t}" data-act="change-type" data-i="${i}" data-v="${t}">${typeWord[t]}</button>`).join('')}</div></div>
      ${itemFields(it, i)}</article>`).join('') || '<div class="empty">No Class Items yet. Pick a kind above.</div>'}
  </div>`;
}

/* Abilities: waiting items first, then each ability with its grant shown as a link. */
function grantSelect(i, kind) {
  const a = state.abilities[i];
  const slot = kind === 'item' ? 'grantItem' : 'grantPet';
  const path = `abilities.${i}.${slot}`;
  const v = a[slot];
  const own = state.items.filter((it) => (kind === 'pet' ? it.type === 'pet' : it.type !== 'pet'));
  const cat = CATALOG.filter((c) => (kind === 'pet' ? c.key.startsWith('pets.') : !c.key.startsWith('pets.')));
  const ownOpts = own.map((it) => {
    const g = granterOf(keyOf(it));
    const taken = g && !(g.kind === 'ability' && g.i === i && g.slot === slot);
    return `<option value="${keyOf(it)}" ${v === keyOf(it) ? 'selected' : ''} ${taken ? 'disabled' : ''}>${esc(tx(it.name) || 'Unnamed')}${taken ? ` (granted by ${esc(tx(g.a.name) || 'another ability')})` : ''}</option>`;
  }).join('');
  const it = v && v.startsWith('ci:') ? itemByKey(v) : null;
  const detail = it ? `<p class="linkline"><span class="typebadge">${typeWord[it.type]}</span><span>${esc(itemStats(it))}</span><span>·</span><span class="odds">${odds(a)}</span><button type="button" class="act" data-act="edit-item" data-v="${it.id}">Edit stats</button></p>` : '';
  return `<div class="stack" style="gap:8px"><label><span class="label">Grants ${kind === 'item' ? 'an item' : 'a pet'}</span><select id="${fid(path)}" data-path="${path}" data-grant="${kind}" data-i="${i}">
    <option value="">Nothing</option>
    ${own.length ? `<optgroup label="This class's Class Items">${ownOpts}</optgroup>` : ''}
    <optgroup label="Shared catalog">${cat.map((c) => `<option value="${c.key}" ${v === c.key ? 'selected' : ''}>${esc(c.label)}</option>`).join('')}</optgroup>
    </select></label>${detail}</div>`;
}
function modsEditor(i) {
  const a = state.abilities[i];
  const nm = tx(a.name) || `ability ${i + 1}`;
  const rows = a.mods.map((m, j) => `<div class="modrow">
      <select id="${fid(`abilities.${i}.mods.${j}.stat`)}" data-path="abilities.${i}.mods.${j}.stat" aria-label="${esc(nm)} modifier ${j + 1} stat">${STATS.map((s) => `<option value="${s.key}" ${m.stat === s.key ? 'selected' : ''}>${s.short}</option>`).join('')}</select>
      <input type="number" id="${fid(`abilities.${i}.mods.${j}.value`)}" data-path="abilities.${i}.mods.${j}.value" data-num="1" min="-6" max="6" value="${m.value}" aria-label="${esc(nm)} modifier ${j + 1} value">
      <div class="scopes" role="group" aria-label="Applies to">${SCOPES.map((s) => `<button type="button" class="act ${m.scope === s.key ? 'on' : ''}" aria-pressed="${m.scope === s.key}" data-act="scope" data-i="${i}" data-j="${j}" data-v="${s.key}">${s.label}</button>`).join('')}</div>
      <button type="button" class="act kill" data-act="rm-mod" data-i="${i}" data-j="${j}">Remove</button>
    </div>`).join('');
  if (!rows) return '';
  return `<div class="stack"><span class="label group">Modifiers</span>${rows}
    <div><button type="button" class="act" data-act="add-mod" data-i="${i}">Add another modifier</button></div></div>`;
}
function tableEditor(i) {
  const t = state.abilities[i].table;
  if (!t) return '';
  const rowSelect = (k) => {
    const path = `abilities.${i}.table.rows.${k}.item`;
    const v = t.rows[k].item || '';
    return `<select id="${fid(path)}" data-path="${path}" data-rowlink="1" aria-label="Row ${k + 1} grants a Class Item"><option value="">No Class Item</option>${state.items.map((it) => {
      const g = granterOf(keyOf(it));
      const taken = g && !(g.kind === 'table' && g.i === i && g.row === k);
      return `<option value="${keyOf(it)}" ${v === keyOf(it) ? 'selected' : ''} ${taken ? 'disabled' : ''}>${esc(tx(it.name) || 'Unnamed')}${taken ? ' (granted elsewhere)' : ''}</option>`;
    }).join('')}</select>`;
  };
  const a = state.abilities[i];
  const linked = t.rows.map((r, k) => ({ k, it: r.item ? itemByKey(r.item) : null })).filter((x) => x.it);
  const confirming = ui.confirm && ui.confirm.type === 'table' && ui.confirm.id === a.id;
  const confirmHtml = confirming ? `<div class="confirm" role="group" aria-label="Confirm removal"><p>${linked.map((x) => `Row ${x.k + 1} grants “${esc(tx(x.it.name) || 'Unnamed')}”`).join('. ')}. Remove the table? ${linked.length > 1 ? 'Those items' : 'That item'} will wait for an ability.</p>
    <div class="inline"><button type="button" class="act danger" data-act="rm-table-yes" data-i="${i}">Remove table</button><button type="button" class="act" data-act="confirm-cancel" data-v="table-${a.id}">Keep it</button></div></div>` : '';
  return `<div class="stack"><div class="spread"><span class="label group" style="margin:0">Reference table · d${t.die}</span>${confirming ? '' : `<button type="button" class="act kill" data-act="rm-table" data-i="${i}">Remove table</button>`}</div>${confirmHtml}
    ${t.rows.map((r, k) => `<div class="rowlink"><span>${k + 1}</span>${textInput(`abilities.${i}.table.rows.${k}.${viewLang}`, { lang: viewLang, label: `Row ${k + 1}` })}${state.items.length ? rowSelect(k) : ''}</div>`).join('')}</div>`;
}
function abilityConfirm(a, i) {
  const owned = [a.grantItem, a.grantPet, ...(a.table ? a.table.rows.map((r) => r.item) : [])].filter((k) => k && k.startsWith('ci:')).map(itemByKey).filter(Boolean);
  const names = owned.map((it) => `“${esc(tx(it.name) || 'Unnamed')}”`).join(' and ');
  return `<div class="confirm" role="group" aria-label="Confirm removal"><p>“${esc(tx(a.name) || 'This ability')}” is the only way to get the Class Item ${names}. Remove ${owned.length > 1 ? 'those items' : 'the item'} too?</p>
    <div class="inline"><button type="button" class="act danger" data-act="rm-ability-yes" data-i="${i}" data-v="both">Remove both</button><button type="button" class="act" data-act="rm-ability-yes" data-i="${i}" data-v="keep">Keep the item, ungranted</button><button type="button" class="act" data-act="confirm-cancel" data-v="ability-${a.id}">Cancel</button></div></div>`;
}
function abilityHeader(a) {
  const it = [a.grantItem, a.grantPet].map((k) => (k && k.startsWith('ci:') ? itemByKey(k) : null)).find((x) => sameName(a, x));
  return `<strong>${esc(tx(a.name) || 'Unnamed ability')}</strong>${it ? `<span class="arrowhead">→ grants ${typeWord[it.type]}</span>` : ''}`;
}
function trayHtml() {
  const waiting = state.items.filter((it) => !granterOf(keyOf(it)));
  if (!waiting.length) return '';
  return `<div class="tray" role="group" aria-labelledby="tray-label"><span class="label group" id="tray-label" style="margin:0">Class Items waiting for an ability</span>

    <p class="hint">Or pick one in an existing ability's grant menu below. A class can't be saved while an item waits.</p></div>`;
}
const CHEV = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"/></svg>';
function abilityChips(a) {
  const chips = [];
  [['grantItem', 'item'], ['grantPet', 'pet']].forEach(([slot, word]) => {
    const k = a[slot]; if (!k) return;
    const it = k.startsWith('ci:') ? itemByKey(k) : null;
    if (it && sameName(a, it)) chips.push(`→ ${typeWord[it.type]}`);
    else chips.push(`${it ? typeWord[it.type] : word}: ${esc(itemLabel(k))}`);
  });
  a.mods.forEach((m) => { const st = STATS.find((x) => x.key === m.stat); chips.push(`${signed(m.value)} ${st ? st.short : ''}${m.scope !== 'all' ? ` ${SCOPES.find((x) => x.key === m.scope).label.toLowerCase()}` : ''}`); });
  if (a.table) chips.push(`d${a.table.die} table`);
  return chips.map((c) => `<span class="chip">${c}</span>`).join('');
}
function abilitySummary(a, i, issues) {
  const miss = issues.filter((x) => x.path && x.path.startsWith(`abilities.${i}.`)).length;
  return `<article class="abl" data-ability="${a.id}" style="view-transition-name:abl-${a.id}"><button type="button" class="abl-sum" data-act="open-ability" data-v="${a.id}" aria-expanded="false" aria-controls="abl-${a.id}">
    <span class="kindtag ${a.random ? '' : 'fixed'}">${a.random ? 'Random' : 'Fixed'}</span>
    <span class="abl-name">${esc(tx(a.name) || 'Unnamed ability')}</span>
    <span class="inline" style="gap:8px">${miss ? `<span class="chip warn" aria-label="${miss} to fix">${miss}</span>` : ''}<span class="abl-edit">Edit${CHEV}</span></span>

function forgeRow(a, i) {

  return `<div class="stepper choice"><span class="label group" id="forge-${a.id}">Forge a Class Item named “${esc(tx(a.name) || 'this ability')}”</span>
    <div class="inline"><div class="seg" role="group" aria-labelledby="forge-${a.id}">${['weapon', 'armor', 'equipment', 'pet'].map((t) => `<button type="button" class="act" data-act="forge-type" data-i="${i}" data-v="${t}" ${free(t) ? '' : 'disabled title="That grant slot is already used"'}>${typeWord[t]}</button>`).join('')}</div>
    <button type="button" class="act" data-act="forge-cancel" data-i="${i}" data-v="${a.id}">Cancel</button></div></div>`;
}
function abilityOpen(a, i) {
  const confirming = ui.confirm && ui.confirm.type === 'ability' && ui.confirm.id === a.id;

    a.mods.length ? '' : `<button type="button" class="act" data-act="add-mod" data-i="${i}">Add modifier</button>`,
    a.table ? '' : `<button type="button" class="act" data-act="add-table" data-i="${i}">Add reference table</button>`,
  ].join('');
  return `<article class="row stack abl open" id="abl-${a.id}" style="view-transition-name:abl-${a.id}" aria-label="${esc(tx(a.name) || 'Unnamed ability')}" data-ability="${a.id}">

      ${confirming ? abilityConfirm(a, i) : ''}
      ${lfield(`abilities.${i}.name`, 'Name')}
      ${lfield(`abilities.${i}.text`, 'Rules text', { multiline: true })}
      ${showGrants ? `<div class="grid2" style="align-items:start">${grantSelect(i, 'item')}${grantSelect(i, 'pet')}</div>${forgeRow(a, i)}` : ''}

    </article>`;
}
function abilitiesBody() {

/* ---------- shell ---------- */
function railHtml(issues) {

    case 'add-origin': state.origins.push(L('', '')); opts = { focusPath: `origins.${state.origins.length - 1}.${viewLang}` }; break;
    case 'rm-origin': { const o = state.origins[i]; withUndo(`Removed origin ${i + 1}.`, () => { state.origins.splice(i, 1); }, () => { state.origins.splice(Math.min(i, state.origins.length), 0, o); }, `[data-act="rm-origin"][data-i="${i}"]`); } opts = { keepFocus: [`[data-act="rm-origin"][data-i="${Math.min(i, state.origins.length - 1)}"]`, '[data-act="add-origin"]'] }; break;
    case 'undo': { const fs = undo(); opts = { focusSel: fs, keepFocus: ['#step-title'] }; break; }
    case 'forge-for': ui.forgeFor = Number(v); opts = { focusSel: `[data-act="forge-type"][data-i="${i}"]:not([disabled])` }; break;
    case 'forge-cancel': ui.forgeFor = null; opts = { keepFocus: [`[data-act="forge-for"][data-i="${i}"]`] }; break;
    case 'forge-type': {
      const ab = state.abilities[i];
      const it = newItem(v, ab.name);
      ab[slotFor(v)] = keyOf(it); ui.forgeFor = null; ui.itemsNo = false;
      announce(`New ${typeWord[v]} “${tx(it.name) || 'Unnamed'}” forged and granted by ${tx(ab.name) || 'this ability'}. Set its stats in Class Items.`);
      opts = { focusSel: `#${fid(`abilities.${i}.${slotFor(v)}`)}` };
      break;
    }
    case 'grant-waiting': {
      const ab = state.abilities[i], it = state.items.find((x) => x.id === Number(v));
      ab[slotFor(it.type)] = keyOf(it);
      announce(`${tx(ab.name) || 'This ability'} now grants ${typeWord[it.type]} “${tx(it.name) || 'Unnamed'}”.`);
      opts = { focusSel: `#${fid(`abilities.${i}.${slotFor(it.type)}`)}` };
      break;
    }
    case 'change-type': {
      const it = state.items[i];
      if (it.type === v) return;
      const before = structuredClone(it), k = keyOf(it), g = granterOf(k);
      let note = '';
      let gBefore = null;
      if (g && g.kind === 'ability' && g.slot !== slotFor(v)) {
        gBefore = { aid: g.a.id, grantItem: g.a.grantItem, grantPet: g.a.grantPet };
        if (!g.a[slotFor(v)]) note = ` Its grant moved to ${v === 'pet' ? 'the pet' : 'the item'} slot.`;
        else note = ` ${tx(g.a.name) || 'Its ability'} already grants a ${v === 'pet' ? 'pet' : 'item'}, so “${tx(it.name) || 'Unnamed'}” now waits for an ability.`;
      }
      withUndo(`“${tx(it.name) || 'Unnamed'}” is now ${typeWord[v] === 'gear' ? 'gear' : `a ${typeWord[v]}`}.${note}`, () => {
        TYPE_FIELDS.forEach((f) => { delete it[f]; });
        Object.assign(it, { type: v }, TYPE_DEFAULTS[v]());
        if (gBefore) { const moveTo = slotFor(v); if (!g.a[moveTo]) g.a[moveTo] = k; g.a[g.slot] = ''; }
      }, () => {
        Object.keys(it).forEach((f) => { delete it[f]; });
        Object.assign(it, before);
        if (gBefore) { const ab = abilityById(gBefore.aid); if (ab) { ab.grantItem = gBefore.grantItem; ab.grantPet = gBefore.grantPet; } }
      }, `[data-act="change-type"][data-i="${i}"][data-v="${before.type}"]`);
      break;
    }
    case 'set-langs': state.languages = v === 'both' ? ['en', 'pl'] : [v]; break;
    case 'view-lang': viewLang = v; break;
    case 'step': step = Math.max(0, Math.min(STEPS.length - 1, Number(v))); saveMsg = ''; ui.confirm = null; ui.forgeFor = null; opts = { focusHeading: true }; break;
    case 'goto-issue': {
      const x = validate()[Number(v)];
      if (!x) return;
      step = stepIndex(x.step);
      if (x.lang) viewLang = x.lang;
      { const m = x.path && x.path.match(/^abilities\.(\d+)\./); if (m) ui.openAbility = state.abilities[Number(m[1])].id; }
      opts = x.focusSel ? { focusSel: x.focusSel } : x.path ? { focusPath: x.path } : { focusHeading: true };
      break;
    }
    case 'roll': testRoll(); break;
    case 'save': {
      const n = validate().length;
      saveMsg = n ? `${n} ${n === 1 ? 'thing' : 'things'} to fix before this class can be saved. Use Fix to jump to each one.` : 'Saved. In the real app this class now appears in your class list.';
      break;
    }
    default: return;
  }
  const act = b.dataset.act;
  const kind = act === 'step' || act === 'goto-issue' || act === 'goto-granter' || act === 'edit-item' || act === 'grant-new' ? 'step'
    : act === 'open-ability' || act === 'add-ability' || act === 'show-grants' ? 'open'
    : act === 'close-ability' || act === 'rm-ability' || act === 'rm-ability-yes' ? 'close' : null;
  if (kind === 'open' || kind === 'close') opts.stay = true;
  if (kind) withTransition(kind, () => render(opts)); else render(opts);
});
render();
})();
</script>
