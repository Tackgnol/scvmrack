name: scvmrack-integration

services:
  db:
    image: scvmrack-db:integration
    pull_policy: never
    build:
      context: .
      dockerfile: backend/Dockerfile.integration-db
    environment:
      POSTGRES_USER: p1002_scmgrinder
      POSTGRES_PASSWORD: p1002_scmgrinder
      POSTGRES_DB: p1002_scmgrinder
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U p1002_scmgrinder"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: scvmrack-api:integration
    pull_policy: never
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    command: npm run prisma:migrate
    environment:
      DATABASE_USER: p1002_scmgrinder
      DATABASE_PASSWORD: p1002_scmgrinder
      DATABASE_NAME: p1002_scmgrinder
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_URL: postgresql://p1002_scmgrinder:p1002_scmgrinder@db:5432/p1002_scmgrinder
    depends_on:
      db:
        condition: service_healthy

  api:
    image: scvmrack-api:integration
    pull_policy: never
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    command: npm run start
    environment:
      DATABASE_USER: p1002_scmgrinder
      DATABASE_PASSWORD: p1002_scmgrinder
      DATABASE_NAME: p1002_scmgrinder
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_URL: postgresql://p1002_scmgrinder:p1002_scmgrinder@db:5432/p1002_scmgrinder
      PORT: 3000
      NODE_ENV: test
      CLIENT_ORIGIN: http://localhost:5173
      CLIENT_GATEWAY: http://localhost:5173
      APP_BASE_URL: http://localhost:5173
      AUTH_BASE_URL: http://api:3000/api/auth
      BETTER_AUTH_SECRET: integration-secret-change-for-prod
      LOGTO_ENDPOINT: https://auth.rpgtools.co
      LOGTO_APP_ID: integration-logto-app-id
      LOGTO_APP_SECRET: integration-logto-app-secret
      LOGTO_REDIRECT_URI: http://api:3000/api/auth/oauth2/callback/logto
      LOGTO_POST_LOGOUT_REDIRECT_URI: http://localhost:5173/
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  integration:
    image: scvmrack-integration-be:latest
    pull_policy: never
    build:
      context: ./backend
      dockerfile: Dockerfile.integration
    environment:
      E2E_BASE_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
