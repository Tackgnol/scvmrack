services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: p1002_scmgrinder
      POSTGRES_PASSWORD: p1002_scmgrinder
      POSTGRES_DB: p1002_scmgrinder
    ports:
      - "5433:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p1002_scmgrinder -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    command: sh -c "npm run prisma:migrate && npm run prisma:seed"
    environment:
      DATABASE_USER: p1002_scmgrinder
      DATABASE_PASSWORD: p1002_scmgrinder
      DATABASE_NAME: p1002_scmgrinder
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_URL: postgresql://p1002_scmgrinder:p1002_scmgrinder@db:5432/p1002_scmgrinder
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    command: npm run dev:api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_USER: p1002_scmgrinder
      DATABASE_PASSWORD: p1002_scmgrinder
      DATABASE_NAME: p1002_scmgrinder
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_URL: postgresql://p1002_scmgrinder:p1002_scmgrinder@db:5432/p1002_scmgrinder
      PORT: 3000
      CLIENT_ORIGIN: http://localhost:5173
      CLIENT_GATEWAY: http://localhost:5173
      APP_BASE_URL: http://localhost:5173
      AUTH_BASE_URL: http://localhost:3000/api/auth
      BETTER_AUTH_SECRET: dev-only-better-auth-secret-change-for-prod
      LOGTO_ENDPOINT: ${LOGTO_ENDPOINT:-https://auth.rpgtools.co}
      LOGTO_APP_ID: ${LOGTO_APP_ID:-dev-logto-app-id}
      LOGTO_APP_SECRET: ${LOGTO_APP_SECRET:-dev-logto-app-secret}
      LOGTO_REDIRECT_URI: http://localhost:3000/api/auth/oauth2/callback/logto
      LOGTO_POST_LOGOUT_REDIRECT_URI: http://localhost:5173/
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      VITE_GLITCHTIP_DSN: ${VITE_GLITCHTIP_DSN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/backend/src
        - action: rebuild
          path: ./backend/package.json
        - action: rebuild
          path: ./backend/package-lock.json

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_URL: ""
      API_PROXY_TARGET: http://api:3000
      VITE_SITE_URL: http://localhost:5173
      VITE_LOGTO_ENDPOINT: ${LOGTO_ENDPOINT:-https://auth.rpgtools.co}
      VITE_ALLOWED_HOSTS: localhost,127.0.0.1,web
      VITE_GLITCHTIP_DSN: ${VITE_GLITCHTIP_DSN:-}
    depends_on:
      - api
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/static
          target: /app/static
        - action: sync
          path: ./frontend/index.html
          target: /app/index.html
        - action: sync
          path: ./frontend/obr.html
          target: /app/obr.html
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json

volumes:
  pgdata-dev:
