name: scvmrack-e2e

services:
  mailpit:
    image: axllent/mailpit:latest
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8025"]
      interval: 5s
      timeout: 5s
      retries: 10

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: p1002_scmgrinder
      POSTGRES_PASSWORD: p1002_scmgrinder
      POSTGRES_DB: p1002_scmgrinder
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U p1002_scmgrinder"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: scvmgrinder_be:e2e
    pull_policy: never
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    command: sh -c "npm run prisma:migrate && npm run prisma:seed"
    environment:
      DATABASE_USER: p1002_scmgrinder
      DATABASE_PASSWORD: p1002_scmgrinder
      DATABASE_NAME: p1002_scmgrinder
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_URL: postgresql://p1002_scmgrinder:p1002_scmgrinder@db:5432/p1002_scmgrinder
    depends_on:
      db:
        condition: service_healthy

  api:
    image: scvmgrinder_be:e2e
    pull_policy: never
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    environment:
      DATABASE_USER: p1002_scmgrinder
      DATABASE_PASSWORD: p1002_scmgrinder
      DATABASE_NAME: p1002_scmgrinder
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_URL: postgresql://p1002_scmgrinder:p1002_scmgrinder@db:5432/p1002_scmgrinder
      PORT: 3000
      NODE_ENV: test
      CLIENT_ORIGIN: http://web:5173
      CLIENT_GATEWAY: http://web:5173
      BETTER_AUTH_SECRET: e2e-secret
      AUTH_BASE_URL: http://api:3000/api/auth
      APP_BASE_URL: http://web:5173
      LOGTO_ENDPOINT: ${LOGTO_ENDPOINT:-https://auth.rpgtools.co}
      LOGTO_APP_ID: ${LOGTO_APP_ID:-e2e-logto-app-id}
      LOGTO_APP_SECRET: ${LOGTO_APP_SECRET:-e2e-logto-app-secret}
      LOGTO_REDIRECT_URI: http://api:3000/api/auth/oauth2/callback/logto
      LOGTO_POST_LOGOUT_REDIRECT_URI: http://web:5173/
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_SECURE: "false"
      MAIL_USER: e2e@example.com
      MAIL_PASS: e2e
      ENABLE_TEST_ROUTES: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  web:
    image: scvmgrinder_fe:e2e
    pull_policy: never
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_BACKEND_URL: ""
      VITE_SITE_URL: http://web:5173
      VITE_LOGTO_ENDPOINT: ${LOGTO_ENDPOINT:-https://auth.rpgtools.co}
      VITE_ALLOWED_HOSTS: localhost,127.0.0.1,web
      API_PROXY_TARGET: http://api:3000
      VITE_GA_MEASUREMENT_ID: ""
      VITE_TURNSTILE_SITE_KEY: ""
      VITE_GLITCHTIP_DSN: ""
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5173').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  e2e:
    image: scvmgrinder_e2e:latest
    build:
      context: ./backend/tests/e2e
      dockerfile: Dockerfile
    environment:
      CI: ${CI:-false}
      PLAYWRIGHT_BASE_URL: http://web:5173
      PLAYWRIGHT_MAILPIT_URL: http://mailpit:8025
      PLAYWRIGHT_DEBUG: ${PLAYWRIGHT_DEBUG:-0}
      API_BASE_URL: http://api:3000
    volumes:
      - e2e-playwright-report:/e2e/playwright-report
      - e2e-test-results:/e2e/test-results
    depends_on:
      web:
        condition: service_healthy

volumes:
  e2e-playwright-report:
  e2e-test-results:
