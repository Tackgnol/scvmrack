<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#FFE900" />
<title>Be back in a jiffy — Scvm Rack</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Antonio:wght@400;700&family=MedievalSharp&display=swap" rel="stylesheet" />
<style>
  :root {
    --yellow: #FFE900;
    --pink: #FF3EB5;
    --black: #0a0a0a;
    --white: #f5f5f5;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: var(--yellow);
    color: var(--black);
    font-family: 'Antonio', system-ui, sans-serif;
    overflow: hidden;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }

  /* Pink wedge — top right (matches mock) */
  .wedge-pink {
    position: fixed;
    top: -20vh;
    right: -10vw;
    width: 70vw;
    height: 60vh;
    background: var(--pink);
    clip-path: polygon(100% 0, 100% 100%, 0 0);
    pointer-events: none;
    z-index: 0;
  }

  /* Black wedge — bottom left (matches mock) */
  .wedge-black {
    position: fixed;
    bottom: -10vh;
    left: -10vw;
    width: 60vw;
    height: 50vh;
    background: var(--black);
    clip-path: polygon(0 100%, 100% 100%, 0 0);
    pointer-events: none;
    z-index: 0;
  }

  /* Diagonal grit overlay */
  .grit {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0.10;
    mix-blend-mode: multiply;
    background-image: repeating-linear-gradient(
      115deg,
      transparent 0 6px,
      var(--black) 6px 7px
    );
  }

  /* Page layout */
  .page {
    position: relative;
    z-index: 2;
    min-height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: clamp(20px, 4vw, 56px);
    gap: clamp(24px, 4vh, 48px);
  }

  /* Stamp */
  .stamp {
    justify-self: start;
    background: var(--black);
    color: var(--yellow);
    border: 2px solid var(--yellow);
    box-shadow: 6px 6px 0 var(--yellow);
    padding: 6px 14px;
    font-family: 'Antonio', sans-serif;
    font-weight: 700;
    font-size: clamp(0.85rem, 1.4vw, 1.1rem);
    letter-spacing: 0.32em;
    text-transform: uppercase;
    transform: rotate(-2deg);
  }

  /* Hero — TV + headline */
  .hero {
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: auto auto;
    align-items: center;
    justify-items: center;
    gap: clamp(16px, 4vh, 40px);
  }

  @media (min-width: 900px) {
    .hero {
      grid-template-columns: 1.05fr 1fr;
      grid-template-rows: 1fr;
      justify-items: stretch;
      gap: clamp(20px, 5vw, 80px);
    }
  }

  .tv-wrap {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    width: 100%;
    max-width: 540px;
    margin: 0 auto;
    transform-origin: top center;
    animation: tvSwing 5s ease-in-out infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    .tv-wrap { animation: none; }
  }

  .tv-wrap img {
    display: block;
    width: 100%;
    height: auto;
    filter: drop-shadow(8px 8px 0 var(--black));
  }

  /* CRT static flicker over the screen — subtle */
  .tv-wrap::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.06) 0 2px,
      transparent 2px 4px
    );
    mix-blend-mode: overlay;
    opacity: 0.6;
    animation: scan 4s linear infinite;
  }

  /* Type column */
  .type {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    gap: clamp(16px, 3vh, 28px);
    width: 100%;
  }

  @media (max-width: 899px) {
    .type { align-items: center; text-align: center; }
  }

  .headline {
    position: relative;
    font-family: 'Bebas Neue', 'Antonio', sans-serif;
    font-weight: 700;
    font-size: clamp(3.2rem, 11vw, 8.5rem);
    line-height: 0.88;
    letter-spacing: -0.02em;
    color: var(--black);
    text-transform: uppercase;
    animation: flicker 6s infinite;
  }

  .headline .ghost {
    position: absolute;
    top: 0;
    left: 0;
    color: var(--pink);
    transform: translate(8px, 8px);
    z-index: 0;
    user-select: none;
    pointer-events: none;
  }

  .headline .main {
    position: relative;
    z-index: 1;
  }

  .tagline {
    font-family: 'MedievalSharp', serif;
    font-size: clamp(1.5rem, 3.6vw, 2.4rem);
    color: var(--black);
    line-height: 1.05;
    max-width: 22ch;
    text-shadow: 3px 3px 0 var(--pink);
  }

  .meta {
    font-family: 'Antonio', sans-serif;
    font-size: clamp(0.8rem, 1.1vw, 0.95rem);
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--black);
    opacity: 0.78;
  }

  .meta .dot {
    display: inline-block;
    width: 0.7em;
    height: 0.7em;
    background: var(--pink);
    border: 2px solid var(--black);
    margin-right: 0.6em;
    vertical-align: -1px;
    animation: pulse 1.4s ease-in-out infinite;
  }

  /* Footer */
  .foot {
    justify-self: start;
    font-family: 'Antonio', sans-serif;
    font-size: 0.78rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--white);
    background: var(--black);
    padding: 6px 12px;
    border: 2px solid var(--yellow);
    box-shadow: 4px 4px 0 var(--pink);
    transform: rotate(-1deg);
  }

  /* Animations */
  @keyframes tvSwing {
    0%   { transform: rotate(-1.5deg) translateY(0); }
    50%  { transform: rotate(1.5deg)  translateY(-4px); }
    100% { transform: rotate(-1.5deg) translateY(0); }
  }

  @keyframes flicker {
    0%, 92%, 100% { opacity: 1; }
    93% { opacity: 0.45; }
    95% { opacity: 1; }
    96% { opacity: 0.6; }
  }

  @keyframes scan {
    0%   { transform: translateY(0); }
    100% { transform: translateY(4px); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.4; transform: scale(0.85); }
  }
</style>
</head>
