server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Backend/API-looking utility paths must not fall through to the SPA shell.
  # /api/* is routed to the backend by the upstream reverse proxy and never
  # reaches here; these are the bare paths that otherwise 200-returned index.html
  # and confused monitoring/exposure scans. /api/health is the real health route.
  location = /health { return 404; }
  location = /openapi.json { return 404; }
  location /docs { return 404; }
  location /test/ { return 404; }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
